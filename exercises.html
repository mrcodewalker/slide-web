<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bài tập · Back-end NodeJS · CT9</title>
  <meta name="description" content="Bài tập thực hành cho từng buổi học Back-end NodeJS với Express — lớp CT9. Có checklist, gợi ý và đáp án mẫu cho giảng viên.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>📝</text></svg>">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/exercises.css">
</head>
<body>
  <div class="aurora"></div><div class="grid-bg"></div>

  <header class="ex-top glass">
    <a class="brand" href="index.html"><span class="logo-dot"></span><b>CT9</b> · Back-end NodeJS</a>
    <nav>
      <a href="index.html">Trang chủ</a>
      <a href="index.html#sessions">12 buổi học</a>
      <a class="active" href="exercises.html">Bài tập</a>
    </nav>
    <div class="top-actions">
      <button class="btn primary" id="btnPdfPreview" title="Xem trước phiếu bài tập chuẩn A4 và tải xuống file PDF">📄 Xem PDF & Tải về</button>
      <label class="switch" title="Hiện đáp án mẫu"><input type="checkbox" id="teacherMode"><i></i><span>Chế độ giảng viên</span></label>
      <button class="btn" id="btnPrint" title="In trực tiếp">🖨️ In</button>
    </div>
  </header>

  <div class="ex-layout container">
    <aside class="ex-side glass" id="side"></aside>
    <main id="main"></main>
  </div>

  <!-- PDF Preview Modal -->
  <div id="pdfModal" class="pdf-modal" aria-hidden="true">
    <div class="pdf-modal-backdrop" id="pdfModalBackdrop"></div>
    <div class="pdf-modal-dialog">
      <header class="pdf-modal-bar glass">
        <div class="pdf-bar-title">
          <span class="icon">📄</span>
          <div>
            <h3 id="pdfModalTitle">Phiếu bài tập thực hành sinh viên</h3>
            <small id="pdfModalSub">Định dạng A4 chuẩn học thuật · Tải xuống file PDF hoặc In ấn</small>
          </div>
        </div>
        <div class="pdf-bar-actions">
          <button class="btn primary" id="btnDownloadPdf" title="Xuất file PDF về máy tính">
            <span class="btn-spinner" id="pdfSpinner" style="display:none">⏳</span>
            <span id="pdfBtnText">📥 Tải xuống PDF</span>
          </button>
          <button class="btn" id="btnPrintModal" title="In trực tiếp hoặc Lưu dạng PDF qua Trình duyệt">🖨️ In ấn</button>
          <button class="btn-close" id="btnPdfClose" title="Đóng cửa sổ xem trước (Esc)">✕</button>
        </div>
      </header>

      <div class="pdf-modal-scroll">
        <div class="pdf-paper-container">
          <div id="pdfPaper" class="pdf-paper">
            <!-- Nội dung bài tập được render động bởi exercises.js -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="pdfToast" class="pdf-toast">Đang chuẩn bị file PDF...</div>

  <script src="js/curriculum.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="vendor/hljs-dockerfile.min.js"></script>
  <script src="vendor/hljs-http.min.js"></script>
  <script src="vendor/html2pdf.bundle.min.js"></script>
  <script src="js/exercises.js"></script>
</body>
</html>
