<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <filter id="httpCatShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <linearGradient id="headerGrad5xx" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <rect width="1000" height="580" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="64" rx="16" fill="url(#headerGrad5xx)" />
  <rect x="0" y="44" width="1000" height="20" fill="#991b1b" />
  <text x="500" y="32" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="20" fill="#ffffff">PHÂN TÍCH TOÀN DIỆN CÁC MÃ LỖI SERVER 5XX TRONG EXPRESS</text>
  <text x="500" y="52" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fee2e2">Server Error: Yêu cầu của client hoàn toàn hợp lệ, nhưng máy chủ gặp sự cố không thể xử lý</text>

  <!-- 4 SERVER ERROR BOXES -->
  <!-- 500: Internal Server Error -->
  <g transform="translate(40, 95)" filter="url(#httpCatShadow)">
    <rect width="430" height="200" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2" />
    <rect x="0" y="0" width="430" height="38" rx="12" fill="#ef4444" />
    <rect x="0" y="24" width="430" height="14" fill="#ef4444" />
    <text x="20" y="25" font-family="monospace" font-weight="800" font-size="16" fill="#ffffff">500 Internal Server Error</text>
    <text x="410" y="25" text-anchor="end" font-family="sans-serif" font-weight="700" font-size="12" fill="#fee2e2">Crash / Bug Code</text>

    <g transform="translate(20, 55)">
      <text x="0" y="18" font-family="sans-serif" font-weight="700" font-size="13" fill="#991b1b">Nguyên nhân điển hình trong Node.js:</text>
      <text x="0" y="38" font-family="sans-serif" font-size="11.5" fill="#475569">• Lỗi ngoại lệ chưa được bắt (Unhandled Exception):</text>
      <text x="10" y="58" font-family="monospace" font-size="11" fill="#dc2626">  TypeError: Cannot read properties of undefined</text>
      <text x="0" y="80" font-family="sans-serif" font-size="11.5" fill="#475569">• Lỗi cú pháp SQL hoặc truy vấn Sequelize bị throw</text>
      <text x="0" y="102" font-family="sans-serif" font-size="11.5" fill="#475569">• Tràn bộ nhớ Heap (Out of Memory) hoặc CPU 100%</text>

      <rect y="115" width="390" height="24" rx="4" fill="#fee2e2" />
      <text x="10" y="132" font-family="sans-serif" font-weight="700" font-size="11" fill="#b91c1c">👉 Giải pháp: Luôn bọc luồng bằng Global Error Middleware!</text>
    </g>
  </g>

  <!-- 502: Bad Gateway -->
  <g transform="translate(530, 95)" filter="url(#httpCatShadow)">
    <rect width="430" height="200" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2" />
    <rect x="0" y="0" width="430" height="38" rx="12" fill="#f97316" />
    <rect x="0" y="24" width="430" height="14" fill="#f97316" />
    <text x="20" y="25" font-family="monospace" font-weight="800" font-size="16" fill="#ffffff">502 Bad Gateway</text>
    <text x="410" y="25" text-anchor="end" font-family="sans-serif" font-weight="700" font-size="12" fill="#ffedd5">Reverse Proxy Lỗi</text>

    <g transform="translate(20, 55)">
      <text x="0" y="18" font-family="sans-serif" font-weight="700" font-size="13" fill="#9a3412">Nguyên nhân điển hình trong Production:</text>
      <text x="0" y="38" font-family="sans-serif" font-size="11.5" fill="#475569">• Nginx hoặc Cloudflare đóng vai trò Reverse Proxy</text>
      <text x="0" y="58" font-family="sans-serif" font-size="11.5" fill="#475569">• Nhưng ứng dụng Node.js (cổng 3000) đã bị sập/crash!</text>
      <text x="0" y="80" font-family="sans-serif" font-size="11.5" fill="#475569">• Nginx gửi request vào cổng 3000 nhận về <tspan font-family="monospace" fill="#ea580c">ECONNREFUSED</tspan></text>
      <text x="0" y="102" font-family="sans-serif" font-size="11.5" fill="#475569">• Proxy không nhận được phản hồi hợp lệ từ upstream</text>

      <rect y="115" width="390" height="24" rx="4" fill="#ffedd5" />
      <text x="10" y="132" font-family="sans-serif" font-weight="700" font-size="11" fill="#c2410c">👉 Giải pháp: Dùng PM2 hoặc Render Auto-Restart!</text>
    </g>
  </g>

  <!-- 503: Service Unavailable -->
  <g transform="translate(40, 315)" filter="url(#httpCatShadow)">
    <rect width="430" height="200" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="2" />
    <rect x="0" y="0" width="430" height="38" rx="12" fill="#eab308" />
    <rect x="0" y="24" width="430" height="14" fill="#eab308" />
    <text x="20" y="25" font-family="monospace" font-weight="800" font-size="16" fill="#ffffff">503 Service Unavailable</text>
    <text x="410" y="25" text-anchor="end" font-family="sans-serif" font-weight="700" font-size="12" fill="#fef9c3">Quá tải / Bảo trì</text>

    <g transform="translate(20, 55)">
      <text x="0" y="18" font-family="sans-serif" font-weight="700" font-size="13" fill="#854d0e">Nguyên nhân điển hình:</text>
      <text x="0" y="38" font-family="sans-serif" font-size="11.5" fill="#475569">• Máy chủ đang bảo trì có kế hoạch (Maintenance)</text>
      <text x="0" y="58" font-family="sans-serif" font-size="11.5" fill="#475569">• Hệ thống quá tải đột biến (Lượng request vượt trần CPU)</text>
      <text x="0" y="80" font-family="sans-serif" font-size="11.5" fill="#475569">• Cơ sở dữ liệu MySQL hết Connection Pool</text>
      <text x="0" y="102" font-family="sans-serif" font-size="11.5" fill="#475569">• Kèm theo header: <tspan font-family="monospace" fill="#ca8a04">Retry-After: 300</tspan> (thử lại sau 5 phút)</text>

      <rect y="115" width="390" height="24" rx="4" fill="#fef9c3" />
      <text x="10" y="132" font-family="sans-serif" font-weight="700" font-size="11" fill="#a16207">👉 Giải pháp: Tăng tài nguyên RAM/CPU hoặc Caching Redis!</text>
    </g>
  </g>

  <!-- 504: Gateway Timeout -->
  <g transform="translate(530, 315)" filter="url(#httpCatShadow)">
    <rect width="430" height="200" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2" />
    <rect x="0" y="0" width="430" height="38" rx="12" fill="#a855f7" />
    <rect x="0" y="24" width="430" height="14" fill="#a855f7" />
    <text x="20" y="25" font-family="monospace" font-weight="800" font-size="16" fill="#ffffff">504 Gateway Timeout</text>
    <text x="410" y="25" text-anchor="end" font-family="sans-serif" font-weight="700" font-size="12" fill="#f3e8ff">Chờ quá hạn</text>

    <g transform="translate(20, 55)">
      <text x="0" y="18" font-family="sans-serif" font-weight="700" font-size="13" fill="#6b21a8">Nguyên nhân điển hình:</text>
      <text x="0" y="38" font-family="sans-serif" font-size="11.5" fill="#475569">• Reverse Proxy chờ máy chủ Node.js quá 30 - 60 giây</text>
      <text x="0" y="58" font-family="sans-serif" font-size="11.5" fill="#475569">• Câu lệnh SQL chạy quá chậm (Full table scan hàng triệu dòng)</text>
      <text x="0" y="80" font-family="sans-serif" font-size="11.5" fill="#475569">• Gọi API bên thứ ba (Stripe/PayPal/ZaloPay) bị treo mạng</text>
      <text x="0" y="102" font-family="sans-serif" font-size="11.5" fill="#475569">• Vòng lặp vô tận (Infinite loop) khóa cứng Event Loop</text>

      <rect y="115" width="390" height="24" rx="4" fill="#f3e8ff" />
      <text x="10" y="132" font-family="sans-serif" font-weight="700" font-size="11" fill="#7e22ce">👉 Giải pháp: Đánh Index B-Tree &amp; đặt Request Timeout!</text>
    </g>
  </g>

  <!-- Bottom Tip -->
  <text x="500" y="545" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="12" fill="#64748b">⚠️ Phân biệt cốt lõi: 4xx = Lỗi do Client gửi sai thông tin | 5xx = Lỗi nội bộ hạ tầng hoặc code Server bị crash!</text>
</svg>
