<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <filter id="swagShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrowGreenSwag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#16a34a" />
    </marker>
    <linearGradient id="headerGradSwag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <rect width="1000" height="580" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="64" rx="16" fill="url(#headerGradSwag)" />
  <rect x="0" y="44" width="1000" height="20" fill="#047857" />
  <text x="500" y="32" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="20" fill="#ffffff">CƠ CHẾ BEARER AUTHENTICATION TRÊN SWAGGER UI</text>
  <text x="500" y="52" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#d1fae5">Tương tác trực tiếp: Nhập JWT Token một lần ➔ Tự động đính kèm Header Authorization vào mọi request</text>

  <!-- LEFT: Swagger UI Available Authorizations Modal -->
  <g transform="translate(40, 95)" filter="url(#swagShadow)">
    <rect width="450" height="440" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8" />
    
    <!-- Modal Window Bar -->
    <rect x="0" y="0" width="450" height="42" rx="12" fill="#334155" />
    <rect x="0" y="24" width="450" height="18" fill="#334155" />
    <text x="20" y="27" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff">🔓 Available authorizations</text>
    <text x="420" y="27" font-family="sans-serif" font-weight="700" font-size="14" fill="#94a3b8">✕</text>

    <!-- Scheme Definition -->
    <g transform="translate(24, 60)">
      <text x="0" y="20" font-family="sans-serif" font-weight="800" font-size="15" fill="#0f172a">bearerAuth (http, Bearer)</text>
      <text x="0" y="42" font-family="sans-serif" font-size="12" fill="#64748b">JWT Access Token định dạng Bearer</text>

      <!-- Input Field -->
      <text x="0" y="75" font-family="sans-serif" font-weight="700" font-size="12" fill="#334155">Value:</text>
      <rect x="0" y="85" width="402" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="12" y="112" font-family="monospace" font-size="11" fill="#2563eb">eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...</text>

      <!-- Authorize & Close Buttons -->
      <g transform="translate(0, 145)">
        <rect width="140" height="38" rx="6" fill="#10b981" />
        <text x="70" y="24" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff">Authorize 🔓</text>

        <rect x="155" width="100" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
        <text x="205" y="24" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="13" fill="#475569">Close</text>
      </g>

      <!-- Status banner -->
      <rect x="0" y="210" width="402" height="75" rx="8" fill="#ecfdf5" stroke="#a7f3d0" />
      <text x="15" y="235" font-family="sans-serif" font-weight="700" font-size="12" fill="#065f46">✅ Trạng thái sau khi bấm Authorize:</text>
      <text x="15" y="258" font-family="sans-serif" font-size="11" fill="#047857">• Biểu tượng ổ khóa chuyển thành đã khóa: <tspan font-weight="700">🔒 (Authorized)</tspan></text>
      <text x="15" y="278" font-family="sans-serif" font-size="11" fill="#047857">• Token được lưu vào bộ nhớ phiên trình duyệt</text>

      <rect x="0" y="305" width="402" height="45" rx="8" fill="#f8fafc" />
      <text x="12" y="332" font-family="sans-serif" font-size="11" fill="#64748b">Cấu hình JSDoc: <tspan font-family="monospace" font-weight="700" fill="#0f172a">@openapi security: [ { bearerAuth: [] } ]</tspan></text>
    </g>
  </g>

  <!-- RIGHT: Interactive Request Execution (Try it out) -->
  <g transform="translate(520, 95)" filter="url(#swagShadow)">
    <rect width="440" height="440" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8" />
    
    <!-- Endpoint bar -->
    <rect x="0" y="0" width="440" height="48" rx="12" fill="#ecfdf5" stroke="#10b981" />
    <rect x="15" y="10" width="65" height="28" rx="4" fill="#10b981" />
    <text x="47" y="28" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="12" fill="#ffffff">POST</text>
    <text x="95" y="29" font-family="monospace" font-weight="700" font-size="13" fill="#0f172a">/api/v1/posts</text>
    <text x="405" y="30" font-family="sans-serif" font-size="16" fill="#10b981">🔒</text>

    <!-- Request Details Inside Panel -->
    <g transform="translate(20, 65)">
      <text x="0" y="18" font-family="sans-serif" font-weight="700" font-size="12" fill="#334155">Parameters &amp; Headers Tự Động Sinh:</text>
      
      <!-- Injected Curl Box -->
      <rect x="0" y="30" width="400" height="150" rx="8" fill="#0f172a" />
      <text x="15" y="55" font-family="monospace" font-size="11" fill="#38bdf8">curl -X 'POST' \</text>
      <text x="15" y="78" font-family="monospace" font-size="11" fill="#f8fafc">  'https://api.devblog.vn/v1/posts' \</text>
      <text x="15" y="102" font-family="monospace" font-size="11" fill="#facc15">  -H 'Authorization: Bearer eyJhbGci...' \</text>
      <text x="15" y="125" font-family="monospace" font-size="11" fill="#f8fafc">  -H 'Content-Type: application/json' \</text>
      <text x="15" y="148" font-family="monospace" font-size="11" fill="#34d399">  -d '{"title":"Học Swagger"}'</text>

      <!-- Server Response -->
      <text x="0" y="210" font-family="sans-serif" font-weight="700" font-size="12" fill="#334155">Server Response (HTTP 201 Created):</text>
      <rect x="0" y="222" width="400" height="120" rx="8" fill="#f0fdf4" stroke="#86efac" />
      <text x="15" y="248" font-family="monospace" font-weight="700" font-size="11" fill="#15803d">Status Code: 201 Created</text>
      <text x="15" y="272" font-family="monospace" font-size="11" fill="#166534">{</text>
      <text x="30" y="294" font-family="monospace" font-size="11" fill="#166534">  "ok": true,</text>
      <text x="30" y="316" font-family="monospace" font-size="11" fill="#166534">  "data": { "id": 102, "title": "Học Swagger" }</text>
      <text x="15" y="334" font-family="monospace" font-size="11" fill="#166534">}</text>
    </g>
  </g>

  <!-- Connect Modal to Endpoint -->
  <path d="M 490 260 L 518 260" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreenSwag)" />
</svg>
