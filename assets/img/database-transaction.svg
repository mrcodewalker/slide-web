<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Database transaction atomicity</title>
  <desc id="desc">Diagram showing a transfer of 100 dollars from account A to account B. Atomicity allows either both changes to commit or the transaction to abort and roll back.</desc>

  <style>
    .title { font: 700 24px Arial, Helvetica, sans-serif; fill: #202122; }
    .subtitle { font: 14px Arial, Helvetica, sans-serif; fill: #54595d; }
    .label { font: 700 15px Arial, Helvetica, sans-serif; fill: #202122; }
    .small { font: 13px Arial, Helvetica, sans-serif; fill: #54595d; }
    .amount { font: 700 20px Arial, Helvetica, sans-serif; fill: #202122; }
    .box { fill: #fff; stroke: #a2a9b1; stroke-width: 1.5; }
    .commit { fill: #ecf7f1; stroke: #14866d; stroke-width: 1.5; }
    .abort { fill: #fef0f0; stroke: #d33; stroke-width: 1.5; }
    .arrow { stroke: #72777d; stroke-width: 1.8; fill: none; marker-end: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#72777d"/>
    </marker>
  </defs>

  <text x="380" y="34" text-anchor="middle" class="title">Database transaction atomicity</text>
  <text x="380" y="58" text-anchor="middle" class="subtitle">A transaction commits all of its changes, or none of them</text>

  <!-- Initial state -->
  <text x="140" y="100" text-anchor="middle" class="label">Before transaction</text>

  <rect x="70" y="120" width="140" height="58" rx="6" class="box"/>
  <text x="140" y="145" text-anchor="middle" class="small">Account A</text>
  <text x="140" y="167" text-anchor="middle" class="amount">$500</text>

  <rect x="70" y="192" width="140" height="58" rx="6" class="box"/>
  <text x="140" y="217" text-anchor="middle" class="small">Account B</text>
  <text x="140" y="239" text-anchor="middle" class="amount">$200</text>

  <!-- Transaction -->
  <text x="380" y="100" text-anchor="middle" class="label">Transfer $100</text>

  <rect x="300" y="120" width="160" height="130" rx="6" class="box"/>
  <text x="380" y="154" text-anchor="middle" class="small">1. Debit A by $100</text>
  <text x="380" y="187" text-anchor="middle" class="small">2. Credit B by $100</text>
  <line x1="320" y1="210" x2="440" y2="210" stroke="#c8ccd1" stroke-width="1"/>
  <text x="380" y="234" text-anchor="middle" class="small">Single transaction</text>

  <path d="M210 185 C245 185 260 185 300 185" class="arrow"/>

  <!-- Atomic outcomes -->
  <text x="620" y="100" text-anchor="middle" class="label">Atomic outcomes</text>

  <rect x="535" y="120" width="170" height="86" rx="6" class="commit"/>
  <text x="620" y="145" text-anchor="middle" class="label">Commit</text>
  <text x="620" y="169" text-anchor="middle" class="small">A = $400</text>
  <text x="620" y="190" text-anchor="middle" class="small">B = $300</text>

  <rect x="535" y="220" width="170" height="86" rx="6" class="abort"/>
  <text x="620" y="245" text-anchor="middle" class="label">Abort / rollback</text>
  <text x="620" y="269" text-anchor="middle" class="small">A = $500</text>
  <text x="620" y="290" text-anchor="middle" class="small">B = $200</text>

  <path d="M460 165 C500 165 500 163 535 163" class="arrow"/>
  <path d="M460 205 C500 205 500 263 535 263" class="arrow"/>
</svg>
