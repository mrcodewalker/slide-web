<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <filter id="devShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <linearGradient id="headerGradDev" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="1000" height="580" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="64" rx="16" fill="url(#headerGradDev)" />
  <rect x="0" y="44" width="1000" height="20" fill="#1e293b" />
  <text x="500" y="32" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="20" fill="#ffffff">CÔNG CỤ SOI MÃ NGUỒN: CHROME DEVTOOLS ELEMENTS TAB</text>
  <text x="500" y="52" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#94a3b8">Cửa sổ khám phá cấu trúc cây DOM thời gian thực và kiểm tra Box Model CSS</text>

  <!-- CHROME DEVTOOLS WINDOW CONTAINER -->
  <g transform="translate(40, 85)" filter="url(#devShadow)">
    <rect width="920" height="465" rx="12" fill="#202124" stroke="#3c4043" stroke-width="2" />
    
    <!-- DevTools Tab Bar -->
    <rect x="0" y="0" width="920" height="38" rx="12" fill="#292a2d" />
    <rect x="0" y="24" width="920" height="14" fill="#292a2d" />
    
    <!-- Select element icon & responsive device toggle -->
    <text x="20" y="24" font-family="sans-serif" font-size="14" fill="#8ab4f8">↖</text>
    <text x="42" y="24" font-family="sans-serif" font-size="14" fill="#9aa0a6">📱</text>
    
    <!-- Tabs -->
    <rect x="70" y="6" width="85" height="26" rx="4" fill="#35363a" />
    <text x="112" y="23" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="12" fill="#8ab4f8">Elements</text>
    <text x="195" y="23" font-family="sans-serif" font-size="12" fill="#9aa0a6">Console</text>
    <text x="270" y="23" font-family="sans-serif" font-size="12" fill="#9aa0a6">Sources</text>
    <text x="345" y="23" font-family="sans-serif" font-size="12" fill="#9aa0a6">Network</text>
    <text x="420" y="23" font-family="sans-serif" font-size="12" fill="#9aa0a6">Application</text>

    <!-- 2 Column Split View -->
    <!-- LEFT: DOM Tree Panel -->
    <g transform="translate(15, 50)">
      <rect width="520" height="395" rx="8" fill="#1e1f22" stroke="#3c4043" />
      <text x="20" y="30" font-family="monospace" font-size="12" fill="#78a9ff">&lt;!DOCTYPE html&gt;</text>
      <text x="20" y="55" font-family="monospace" font-size="12" fill="#78a9ff">&lt;html <tspan fill="#ffab40">lang</tspan>=<tspan fill="#69db7c">"vi"</tspan>&gt;</text>
      <text x="35" y="80" font-family="monospace" font-size="12" fill="#78a9ff">&lt;head&gt;...&lt;/head&gt;</text>
      
      <text x="35" y="105" font-family="monospace" font-size="12" fill="#78a9ff">&lt;body&gt;</text>
      
      <text x="50" y="130" font-family="monospace" font-size="12" fill="#78a9ff">&lt;header <tspan fill="#ffab40">class</tspan>=<tspan fill="#69db7c">"site-header"</tspan>&gt;...&lt;/header&gt;</text>

      <!-- Hovered Element (Selected) -->
      <rect x="40" y="145" width="460" height="30" rx="4" fill="#2d3748" />
      <text x="50" y="165" font-family="monospace" font-weight="700" font-size="12" fill="#8ab4f8">&lt;main <tspan fill="#ffab40">id</tspan>=<tspan fill="#69db7c">"content"</tspan> <tspan fill="#ffab40">class</tspan>=<tspan fill="#69db7c">"active"</tspan>&gt; == $0</text>
      
      <text x="65" y="200" font-family="monospace" font-size="12" fill="#78a9ff">&lt;h1 <tspan fill="#ffab40">class</tspan>=<tspan fill="#69db7c">"title"</tspan>&gt;<tspan fill="#ffffff">Khóa Học Web Master CT9</tspan>&lt;/h1&gt;</text>
      <text x="65" y="225" font-family="monospace" font-size="12" fill="#78a9ff">&lt;p&gt;<tspan fill="#ffffff">Từ cơ bản đến chuyên sâu...</tspan>&lt;/p&gt;</text>
      <text x="65" y="250" font-family="monospace" font-size="12" fill="#78a9ff">&lt;button <tspan fill="#ffab40">id</tspan>=<tspan fill="#69db7c">"btn-cta"</tspan>&gt;<tspan fill="#ffffff">Đăng Ký Ngay</tspan>&lt;/button&gt;</text>

      <text x="50" y="285" font-family="monospace" font-size="12" fill="#78a9ff">&lt;/main&gt;</text>
      <text x="50" y="310" font-family="monospace" font-size="12" fill="#78a9ff">&lt;footer&gt;...&lt;/footer&gt;</text>
      <text x="35" y="335" font-family="monospace" font-size="12" fill="#78a9ff">&lt;/body&gt;</text>
      <text x="20" y="360" font-family="monospace" font-size="12" fill="#78a9ff">&lt;/html&gt;</text>

      <!-- Breadcrumbs at bottom -->
      <rect x="0" y="365" width="520" height="30" rx="0" fill="#292a2d" />
      <text x="15" y="385" font-family="sans-serif" font-size="11" fill="#8ab4f8">html &gt; body &gt; main#content.active</text>
    </g>

    <!-- RIGHT: Styles & Box Model Panel -->
    <g transform="translate(550, 50)">
      <rect width="355" height="395" rx="8" fill="#1e1f22" stroke="#3c4043" />
      
      <!-- Subtabs -->
      <rect x="0" y="0" width="355" height="32" rx="8" fill="#292a2d" />
      <text x="20" y="21" font-family="sans-serif" font-weight="700" font-size="11" fill="#8ab4f8">Styles</text>
      <text x="80" y="21" font-family="sans-serif" font-size="11" fill="#9aa0a6">Computed</text>
      <text x="160" y="21" font-family="sans-serif" font-size="11" fill="#9aa0a6">Layout</text>
      <text x="225" y="21" font-family="sans-serif" font-size="11" fill="#9aa0a6">Event Listeners</text>

      <!-- Mini CSS Box Model Inspector Graphic -->
      <g transform="translate(25, 45)">
        <!-- Margin -->
        <rect width="305" height="155" rx="6" fill="#f89406" fill-opacity="0.25" stroke="#f89406" stroke-width="1.5" />
        <text x="15" y="20" font-family="sans-serif" font-size="10" fill="#f89406">margin (20px)</text>

        <!-- Border -->
        <g transform="translate(35, 25)">
          <rect width="235" height="105" rx="4" fill="#facc15" fill-opacity="0.25" stroke="#facc15" stroke-width="1.5" />
          <text x="12" y="18" font-family="sans-serif" font-size="10" fill="#facc15">border (2px)</text>

          <!-- Padding -->
          <g transform="translate(30, 20)">
            <rect width="175" height="65" rx="3" fill="#4ade80" fill-opacity="0.25" stroke="#4ade80" stroke-width="1.5" />
            <text x="10" y="16" font-family="sans-serif" font-size="9.5" fill="#4ade80">padding (16px)</text>

            <!-- Content -->
            <g transform="translate(30, 18)">
              <rect width="115" height="30" rx="2" fill="#60a5fa" fill-opacity="0.35" stroke="#60a5fa" stroke-width="1.5" />
              <text x="57" y="20" text-anchor="middle" font-family="monospace" font-weight="700" font-size="10" fill="#93c5fd">800 × 420</text>
            </g>
          </g>
        </g>
      </g>

      <!-- Active CSS Rules -->
      <g transform="translate(20, 220)">
        <text x="0" y="15" font-family="monospace" font-weight="700" font-size="11" fill="#69db7c">main#content.active {</text>
        <text x="15" y="35" font-family="monospace" font-size="11" fill="#ffab40">display</text>
        <text x="80" y="35" font-family="monospace" font-size="11" fill="#ffffff">: flex;</text>
        <text x="15" y="55" font-family="monospace" font-size="11" fill="#ffab40">background</text>
        <text x="100" y="55" font-family="monospace" font-size="11" fill="#69db7c">: #ffffff;</text>
        <text x="15" y="75" font-family="monospace" font-size="11" fill="#ffab40">box-sizing</text>
        <text x="100" y="75" font-family="monospace" font-size="11" fill="#8ab4f8">: border-box;</text>
        <text x="0" y="95" font-family="monospace" font-weight="700" font-size="11" fill="#69db7c">}</text>

        <rect y="110" width="315" height="48" rx="6" fill="#2d3748" />
        <text x="12" y="130" font-family="sans-serif" font-weight="700" font-size="10.5" fill="#8ab4f8">Phím tắt vàng:</text>
        <text x="12" y="148" font-family="sans-serif" font-size="10" fill="#cbd5e1">Bấm <tspan font-family="monospace" font-weight="700" fill="#ffffff">F12</tspan> hoặc chuột phải ➔ Inspect để sửa CSS trực tiếp!</text>
      </g>
    </g>
  </g>
</svg>
