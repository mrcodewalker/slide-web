<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <filter id="mockShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#16a34a" />
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#dc2626" />
    </marker>
    <linearGradient id="headerGradMock" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
  </defs>

  <rect width="1000" height="580" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="64" rx="16" fill="url(#headerGradMock)" />
  <rect x="0" y="44" width="1000" height="20" fill="#7c3aed" />
  <text x="500" y="32" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="20" fill="#ffffff">KỸ THUẬT MOCKING TRONG JEST: CÔ LẬP DATABASE &amp; NETWORK</text>
  <text x="500" y="52" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ede9fe">Unit Test kiểm thử logic độc lập — Tốc độ chạy 2ms, không phụ thuộc hạ tầng thật</text>

  <!-- LEFT: Jest Test Runner & Test Case -->
  <g transform="translate(40, 95)" filter="url(#mockShadow)">
    <rect width="260" height="440" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2" />
    <rect x="0" y="0" width="260" height="36" rx="12" fill="#a855f7" />
    <rect x="0" y="24" width="260" height="12" fill="#a855f7" />
    <text x="130" y="24" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="#ffffff">🧪 Jest Test Suite</text>
    
    <rect x="15" y="55" width="230" height="110" rx="8" fill="#ffffff" stroke="#e9d5ff" />
    <text x="25" y="78" font-family="monospace" font-size="11" fill="#6b21a8">describe('UserService')</text>
    <text x="35" y="100" font-family="monospace" font-size="11" fill="#7e22ce">it('throws 409...')</text>
    <text x="35" y="122" font-family="monospace" font-size="11" fill="#16a34a">✓ expect(..).rejects</text>
    <text x="35" y="144" font-family="monospace" font-size="11" fill="#16a34a">✓ findByEmail called</text>

    <rect x="15" y="180" width="230" height="130" rx="8" fill="#ffffff" stroke="#e9d5ff" />
    <text x="25" y="202" font-family="sans-serif" font-weight="700" font-size="12" fill="#581c87">Thiết lập Mock Stub:</text>
    <text x="25" y="226" font-family="monospace" font-size="11" fill="#2563eb">jest.mock('user.repo')</text>
    <text x="25" y="248" font-family="monospace" font-size="10" fill="#059669">repo.findByEmail</text>
    <text x="35" y="268" font-family="monospace" font-size="10" fill="#059669">.mockResolvedValue({</text>
    <text x="45" y="288" font-family="monospace" font-size="10" fill="#059669">  id: 1, email: '...' })</text>

    <rect x="15" y="325" width="230" height="95" rx="8" fill="#ede9fe" />
    <text x="130" y="352" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="12" fill="#6b21a8">⚡ Tốc độ siêu tốc</text>
    <text x="130" y="375" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7e22ce">Thời gian chạy: &lt; 3ms</text>
    <text x="130" y="398" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#16a34a">Không bao giờ bị lỗi mạng!</text>
  </g>

  <!-- CENTER: Subject Under Test (Service Layer) -->
  <g transform="translate(350, 150)" filter="url(#mockShadow)">
    <rect width="280" height="320" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5" />
    <rect x="0" y="0" width="280" height="38" rx="14" fill="#3b82f6" />
    <rect x="0" y="26" width="280" height="12" fill="#3b82f6" />
    <text x="140" y="25" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="#ffffff">🎯 Đối Tượng Test (SUT)</text>
    
    <text x="140" y="70" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="16" fill="#1e3a8a">UserService.js</text>
    <text x="140" y="95" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2563eb">Hàm kiểm thử: registerUser()</text>

    <rect x="20" y="115" width="240" height="175" rx="8" fill="#ffffff" stroke="#bfdbfe" />
    <text x="32" y="140" font-family="sans-serif" font-weight="700" font-size="12" fill="#1e40af">Logic nghiệp vụ cần test:</text>
    <text x="32" y="165" font-family="sans-serif" font-size="11" fill="#334155">1. Nhận email &amp; mật khẩu</text>
    <text x="32" y="190" font-family="sans-serif" font-size="11" fill="#334155">2. Gọi Repo check email trùng</text>
    <text x="32" y="215" font-family="sans-serif" font-size="11" fill="#dc2626">3. Nếu trùng ➔ ném Conflict 409</text>
    <text x="32" y="240" font-family="sans-serif" font-size="11" fill="#16a34a">4. Nếu hợp lệ ➔ băm Bcrypt</text>
    <text x="32" y="265" font-family="sans-serif" font-size="11" fill="#16a34a">5. Lưu và trả dữ liệu sạch</text>
  </g>

  <!-- RIGHT TOP: MOCKED REPOSITORY (ACTIVE) -->
  <g transform="translate(680, 95)" filter="url(#mockShadow)">
    <rect width="280" height="190" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5" />
    <rect x="0" y="0" width="280" height="34" rx="12" fill="#10b981" />
    <rect x="0" y="22" width="280" height="12" fill="#10b981" />
    <text x="140" y="23" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff">✅ Mocked UserRepository (Jest)</text>

    <rect x="15" y="48" width="250" height="30" rx="6" fill="#d1fae5" />
    <text x="140" y="68" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="12" fill="#065f46">Chạy trong Bộ Nhớ RAM (Stub)</text>
    
    <text x="25" y="105" font-family="sans-serif" font-size="11" fill="#047857">• Không kết nối mạng, không gọi SQL</text>
    <text x="25" y="128" font-family="sans-serif" font-size="11" fill="#047857">• Trả về kết quả lập trình viên định sẵn</text>
    <text x="25" y="151" font-family="sans-serif" font-size="11" fill="#047857">• Ghi nhận chính xác số lần hàm được gọi</text>
    <text x="25" y="172" font-family="sans-serif" font-weight="700" font-size="11" fill="#059669">toHaveBeenCalledWith('existed@ct9.vn')</text>
  </g>

  <!-- RIGHT BOTTOM: REAL DATABASE (ISOLATED / DISCONNECTED) -->
  <g transform="translate(680, 335)" filter="url(#mockShadow)">
    <rect width="280" height="200" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4" />
    <rect x="0" y="0" width="280" height="34" rx="12" fill="#ef4444" />
    <rect x="0" y="22" width="280" height="12" fill="#ef4444" />
    <text x="140" y="23" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff">❌ Cơ Sở Dữ Liệu Thật (MySQL)</text>

    <rect x="15" y="48" width="250" height="30" rx="6" fill="#fee2e2" />
    <text x="140" y="68" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="12" fill="#b91c1c">HOÀN TOÀN CÔ LẬP / TÁCH RỜI</text>

    <text x="25" y="105" font-family="sans-serif" font-size="11" fill="#991b1b">• Không mở kết nối TCP: 3306</text>
    <text x="25" y="128" font-family="sans-serif" font-size="11" fill="#991b1b">• Không làm bẩn hay ghi đè dữ liệu thật</text>
    <text x="25" y="151" font-family="sans-serif" font-size="11" fill="#991b1b">• Không bị phụ thuộc khi server DB sập</text>
    <text x="25" y="174" font-family="sans-serif" font-weight="700" font-size="11" fill="#dc2626">Unit Test vẫn chạy mượt mà ngay cả khi offline!</text>
  </g>

  <!-- CONNECTING ARROWS -->
  <!-- Jest -> SUT -->
  <path d="M 300 250 L 340 250" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowGreen)" />
  <!-- SUT -> Mock Repo -->
  <path d="M 630 210 L 670 180" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)" />
  <!-- SUT -> Real DB (Blocked) -->
  <path d="M 630 380 L 670 410" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowRed)" />
</svg>
