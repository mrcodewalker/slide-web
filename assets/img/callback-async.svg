<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" height="100%">
  <defs>
    <linearGradient id="asyncGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="asyncBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="asyncPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="asyncAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadowAsync" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="680" height="320" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="340" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#34d399" letter-spacing="0.5">
    ⚡ MÔ HÌNH BẤT ĐỒNG BỘ (ASYNCHRONOUS - NON-BLOCKING)
  </text>
  <text x="340" y="54" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">
    Luồng chính không bao giờ bị đứng chờ — Đẩy I/O xuống tầng ngầm OS &amp; libuv
  </text>

  <!-- Timeline Axis -->
  <line x1="60" y1="230" x2="620" y2="230" stroke="#475569" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="625" y="234" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Thời gian (t) →</text>

  <!-- Main Thread Track -->
  <text x="30" y="90" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8">Luồng chính:</text>
  <text x="30" y="104" font-family="system-ui, sans-serif" font-size="9.5" fill="#94a3b8">(Call Stack)</text>

  <!-- Step 1: Req 1 dispatched -->
  <g filter="url(#shadowAsync)">
    <rect x="130" y="75" width="85" height="38" rx="6" fill="url(#asyncGreen)"/>
    <text x="172" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">Req 1 gửi I/O</text>
    <text x="172" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#d1fae5">Giải phóng ngay</text>
  </g>

  <!-- Step 2: Req 2 processed immediately -->
  <g filter="url(#shadowAsync)">
    <rect x="225" y="75" width="115" height="38" rx="6" fill="url(#asyncBlue)"/>
    <text x="282" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">Req 2 XỬ LÝ NGAY</text>
    <text x="282" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#dbeafe">Không hề bị chờ!</text>
  </g>

  <!-- Step 3: Req 3 processed immediately -->
  <g filter="url(#shadowAsync)">
    <rect x="350" y="75" width="110" height="38" rx="6" fill="url(#asyncPurple)"/>
    <text x="405" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">Req 3 XỬ LÝ NGAY</text>
    <text x="405" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#ede9fe">Phục vụ liên tục</text>
  </g>

  <!-- Step 4: Callback Req 1 -->
  <g filter="url(#shadowAsync)">
    <rect x="470" y="75" width="125" height="38" rx="6" fill="url(#asyncGreen)" stroke="#34d399" stroke-width="1.5"/>
    <text x="532" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">Req 1 Callback</text>
    <text x="532" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#d1fae5">Trả kết quả Req 1</text>
  </g>

  <!-- Background Libuv Track -->
  <text x="30" y="160" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#fbbf24">libuv / Kernel:</text>
  <text x="30" y="174" font-family="system-ui, sans-serif" font-size="9.5" fill="#94a3b8">(Chạy ngầm)</text>

  <!-- Libuv background bar -->
  <g filter="url(#shadowAsync)">
    <rect x="220" y="150" width="245" height="36" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="342" y="167" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fde68a">⚙️ Đọc đĩa SSD / CSDL MySQL chạy ngầm</text>
    <text x="342" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#94a3b8">Khi xong việc đẩy Callback vào Event Queue</text>
  </g>

  <!-- Connection dashed lines -->
  <path d="M 215 95 L 220 150" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M 465 168 L 470 95" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Bottom Benefit Bar -->
  <rect x="40" y="260" width="600" height="42" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="340" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#a7f3d0">
    🚀 Lợi thế Node.js: 1 luồng duy nhất vẫn phục vụ hàng chục ngàn kết nối đồng thời với bộ nhớ RAM cực nhẹ!
  </text>
</svg>
