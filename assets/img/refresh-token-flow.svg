<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <filter id="rtShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="rtArrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
    <marker id="rtArrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
  </defs>

  <rect width="1000" height="560" fill="none" />
  <text x="500" y="38" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="22" fill="#0f172a">CƠ CHẾ XOAY VÒNG REFRESH TOKEN (TOKEN ROTATION)</text>
  <text x="500" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#64748b">Cấp lại Access Token mới mà không bắt người dùng phải đăng nhập lại, tự động phát hiện rò rỉ token</text>

  <!-- Lifeline 1: Web Client -->
  <g transform="translate(150, 90)">
    <rect width="180" height="50" rx="12" fill="#0284c7" filter="url(#rtShadow)" />
    <text x="90" y="32" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="15" fill="#ffffff">🌐 Client (Front-end)</text>
    <line x1="90" y1="50" x2="90" y2="440" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6" />
  </g>

  <!-- Lifeline 2: Auth Server -->
  <g transform="translate(670, 90)">
    <rect width="180" height="50" rx="12" fill="#16a34a" filter="url(#rtShadow)" />
    <text x="90" y="32" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="15" fill="#ffffff">🛡️ Express Auth Server</text>
    <line x1="90" y1="50" x2="90" y2="440" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6" />
  </g>

  <!-- Step 1: Call API with expired token -->
  <line x1="240" y1="175" x2="750" y2="175" stroke="#ef4444" stroke-width="2.2" marker-end="url(#rtArrBlue)" />
  <rect x="360" y="158" width="280" height="24" rx="6" fill="#fef2f2" stroke="#fca5a5" />
  <text x="500" y="175" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#dc2626">1. GET /posts [Token đã hết hạn 15p]</text>

  <!-- Step 2: 401 Unauthorized -->
  <line x1="760" y1="225" x2="250" y2="225" stroke="#ef4444" stroke-width="2.2" marker-end="url(#rtArrBlue)" stroke-dasharray="5 5" />
  <rect x="370" y="208" width="260" height="24" rx="6" fill="#fef2f2" stroke="#fca5a5" />
  <text x="500" y="225" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#dc2626">2. HTTP 401: TokenExpiredError</text>

  <!-- Step 3: Silent Refresh -->
  <line x1="240" y1="290" x2="750" y2="290" stroke="#0284c7" stroke-width="2.5" marker-end="url(#rtArrBlue)" />
  <rect x="330" y="272" width="340" height="26" rx="6" fill="#f0f9ff" stroke="#bae6fd" />
  <text x="500" y="290" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#0369a1">3. POST /auth/refresh [Cookie: refreshToken_v1]</text>

  <!-- Step 4: Token Rotation -->
  <line x1="760" y1="365" x2="250" y2="365" stroke="#16a34a" stroke-width="2.5" marker-end="url(#rtArrGreen)" stroke-dasharray="5 5" />
  <rect x="320" y="347" width="360" height="26" rx="6" fill="#f0fdf4" stroke="#bbf7d0" />
  <text x="500" y="365" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#15803d">4. Trả AccessToken MỚI + Đổi refreshToken_v2</text>

  <!-- Step 5: Retry original request -->
  <line x1="240" y1="430" x2="750" y2="430" stroke="#16a34a" stroke-width="2.5" marker-end="url(#rtArrGreen)" />
  <rect x="350" y="412" width="300" height="24" rx="6" fill="#f0fdf4" stroke="#bbf7d0" />
  <text x="500" y="429" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#15803d">5. Tự động gửi lại request ban đầu thành công!</text>

  <!-- Bottom Tip -->
  <rect x="150" y="485" width="700" height="48" rx="10" fill="#0f172a" />
  <text x="500" y="506" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#38bdf8">
    Token Reuse Detection: Nếu hacker dùng lại refreshToken_v1 cũ, hệ thống lập tức thu hồi
  </text>
  <text x="500" y="524" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1">
    toàn bộ phiên đăng nhập của tài khoản đó (Family Revocation)!
  </text>
</svg>