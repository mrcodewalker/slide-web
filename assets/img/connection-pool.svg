<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <filter id="poolShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="1000" height="560" fill="none" />

  <text x="500" y="38" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="22" fill="#0f172a">KIẾN TRÚC MYSQL2 CONNECTION POOL</text>
  <text x="500" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#64748b">Tái sử dụng kết nối TCP để phục vụ hàng ngàn truy vấn đồng thời mà không nghẽn CSDL</text>

  <!-- Left: Client Requests -->
  <g transform="translate(50, 110)">
    <rect width="220" height="390" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8" filter="url(#poolShadow)" />
    <text x="110" y="36" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="15" fill="#0f172a">Incoming Requests</text>
    <text x="110" y="58" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">Hàng trăm request đồng thời</text>

    <g transform="translate(20, 80)">
      <rect width="180" height="48" rx="8" fill="#e0f2fe" stroke="#38bdf8" />
      <text x="90" y="28" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#0369a1">GET /api/posts</text>
    </g>
    <g transform="translate(20, 145)">
      <rect width="180" height="48" rx="8" fill="#e0f2fe" stroke="#38bdf8" />
      <text x="90" y="28" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#0369a1">POST /api/orders</text>
    </g>
    <g transform="translate(20, 210)">
      <rect width="180" height="48" rx="8" fill="#e0f2fe" stroke="#38bdf8" />
      <text x="90" y="28" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#0369a1">GET /api/users/me</text>
    </g>
    <g transform="translate(20, 275)">
      <rect width="180" height="48" rx="8" fill="#fef3c7" stroke="#fde68a" />
      <text x="90" y="28" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b45309">... 100+ requests khác</text>
    </g>

    <text x="110" y="360" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#475569">Mượn kết nối từ Pool ➔</text>
  </g>

  <!-- Middle: Connection Pool (10 slots) -->
  <g transform="translate(320, 110)">
    <rect width="360" height="390" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2.2" filter="url(#poolShadow)" />
    <path d="M 0 18 Q 0 0 18 0 L 342 0 Q 360 0 360 18 L 360 52 L 0 52 Z" fill="#eff6ff" />
    <text x="180" y="32" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="16" fill="#1d4ed8">🏊 CONNECTION POOL (connectionLimit: 10)</text>

    <!-- 6 active connections -->
    <g transform="translate(25, 75)">
      <rect width="145" height="50" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" />
      <text x="72" y="30" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#15803d">conn #1 (Busy)</text>
    </g>
    <g transform="translate(190, 75)">
      <rect width="145" height="50" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" />
      <text x="72" y="30" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#15803d">conn #2 (Busy)</text>
    </g>
    <g transform="translate(25, 140)">
      <rect width="145" height="50" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" />
      <text x="72" y="30" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#15803d">conn #3 (Busy)</text>
    </g>
    <g transform="translate(190, 140)">
      <rect width="145" height="50" rx="10" fill="#f1f5f9" stroke="#94a3b8" />
      <text x="72" y="30" text-anchor="middle" font-family="monospace" font-size="12" font-weight="600" fill="#64748b">conn #4 (Idle)</text>
    </g>
    <g transform="translate(25, 205)">
      <rect width="145" height="50" rx="10" fill="#f1f5f9" stroke="#94a3b8" />
      <text x="72" y="30" text-anchor="middle" font-family="monospace" font-size="12" font-weight="600" fill="#64748b">conn #5 (Idle)</text>
    </g>
    <g transform="translate(190, 205)">
      <rect width="145" height="50" rx="10" fill="#f1f5f9" stroke="#94a3b8" />
      <text x="72" y="30" text-anchor="middle" font-family="monospace" font-size="12" font-weight="600" fill="#64748b">conn #6 (Idle)</text>
    </g>

    <!-- Queue box -->
    <rect x="25" y="275" width="310" height="90" rx="10" fill="#fef2f2" stroke="#fca5a5" />
    <text x="180" y="302" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="13" fill="#b91c1c">Hàng đợi chờ kết nối (queueLimit: 0)</text>
    <text x="180" y="324" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#7f1d1d">Nếu cả 10 kết nối đều bận, request mới sẽ xếp hàng</text>
    <text x="180" y="344" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#7f1d1d">đợi kết nối trả về thay vì làm sập máy chủ MySQL!</text>
  </g>

  <!-- Right: MySQL Server -->
  <g transform="translate(730, 110)">
    <rect width="220" height="390" rx="16" fill="#f8fafc" stroke="#00758f" stroke-width="2" filter="url(#poolShadow)" />
    <path d="M 0 16 Q 0 0 16 0 L 204 0 Q 220 0 220 16 L 220 52 L 0 52 Z" fill="#e0f2fe" />
    <text x="110" y="34" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="15" fill="#00758f">🐬 MySQL Database</text>

    <!-- Database cylinder graphic -->
    <g transform="translate(50, 80)">
      <ellipse cx="60" cy="20" rx="60" ry="18" fill="#0284c7" />
      <path d="M 0 20 L 0 140 A 60 18 0 0 0 120 140 L 120 20 Z" fill="#0369a1" />
      <ellipse cx="60" cy="60" rx="60" ry="18" fill="#0284c7" opacity="0.4" />
      <ellipse cx="60" cy="100" rx="60" ry="18" fill="#0284c7" opacity="0.4" />
      <ellipse cx="60" cy="140" rx="60" ry="18" fill="#38bdf8" />
    </g>

    <text x="110" y="275" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#0f172a">Tối ưu tài nguyên:</text>
    <text x="110" y="302" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">Chỉ duy trì 10 TCP socket,</text>
    <text x="110" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">tránh tốn RAM khởi tạo</text>
    <text x="110" y="342" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">bắt tay 3 bước (Handshake).</text>
  </g>
</svg>