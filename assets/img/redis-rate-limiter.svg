<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <filter id="rateShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrowRedRate" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#dc2626" />
    </marker>
    <marker id="arrowGreenRate" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#16a34a" />
    </marker>
    <linearGradient id="headerGradRate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <rect width="1000" height="580" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="64" rx="16" fill="url(#headerGradRate)" />
  <rect x="0" y="44" width="1000" height="20" fill="#b91c1c" />
  <text x="500" y="32" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="20" fill="#ffffff">RATE LIMITING PHÂN TÁN VỚI REDIS TRONG EXPRESS</text>
  <text x="500" y="52" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fee2e2">Chống tấn công từ chối dịch vụ (DoS / Brute-force) — Kiểm soát số request tối đa theo IP và User Account</text>

  <!-- 3 MAIN BLOCKS: Client -> Express App -> Redis Store -->
  <!-- 1. Client Incoming Traffic -->
  <g transform="translate(40, 95)" filter="url(#rateShadow)">
    <rect width="240" height="425" rx="14" fill="#faf5ff" stroke="#a855f7" stroke-width="2" />
    <rect x="0" y="0" width="240" height="36" rx="14" fill="#a855f7" />
    <rect x="0" y="24" width="240" height="12" fill="#a855f7" />
    <text x="120" y="24" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff">👥 Client Requests</text>

    <!-- Normal user -->
    <g transform="translate(15, 55)">
      <rect width="210" height="100" rx="8" fill="#ecfdf5" stroke="#10b981" />
      <text x="15" y="25" font-family="sans-serif" font-weight="700" font-size="12" fill="#065f46">Người dùng thông thường:</text>
      <text x="15" y="48" font-family="sans-serif" font-size="11" fill="#047857">Gửi 5 - 10 req/phút</text>
      <rect x="15" y="60" width="180" height="26" rx="4" fill="#10b981" />
      <text x="105" y="78" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="11" fill="#ffffff">✓ Dưới ngưỡng cho phép</text>
    </g>

    <!-- Bot / Spammer -->
    <g transform="translate(15, 175)">
      <rect width="210" height="140" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2" />
      <text x="15" y="25" font-family="sans-serif" font-weight="700" font-size="12" fill="#991b1b">Botnet / Brute-force:</text>
      <text x="15" y="48" font-family="sans-serif" font-size="11" fill="#dc2626">Spam 500 req/giây vào</text>
      <text x="15" y="68" font-family="monospace" font-size="10.5" fill="#991b1b">POST /api/v1/auth/login</text>
      <rect x="15" y="85" width="180" height="40" rx="4" fill="#ef4444" />
      <text x="105" y="103" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="11" fill="#ffffff">⚠️ VƯỢT NGƯỠNG (QUOTA)</text>
      <text x="105" y="118" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#fee2e2">Nguy cơ sập server &amp; DB</text>
    </g>

    <rect x="15" y="335" width="210" height="70" rx="6" fill="#f3e8ff" />
    <text x="105" y="360" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="11" fill="#6b21a8">Chiến lược xác định:</text>
    <text x="105" y="380" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#7e22ce">Theo IP mạng hoặc userId</text>
  </g>

  <!-- 2. Express Server Middleware (Center) -->
  <g transform="translate(320, 95)" filter="url(#rateShadow)">
    <rect width="320" height="425" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
    <rect x="0" y="0" width="320" height="36" rx="14" fill="#1e293b" />
    <rect x="0" y="24" width="320" height="12" fill="#1e293b" />
    <text x="160" y="24" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff">⚙️ Express Rate Limiter Middleware</text>

    <g transform="translate(15, 50)">
      <rect width="290" height="165" rx="8" fill="#1e293b" />
      <text x="12" y="24" font-family="monospace" font-size="10.5" fill="#38bdf8">const limiter = rateLimit({</text>
      <text x="24" y="46" font-family="monospace" font-size="10.5" fill="#f8fafc">  windowMs: 15 * 60 * 1000,</text>
      <text x="24" y="68" font-family="monospace" font-size="10.5" fill="#facc15">  max: 100, // Tối đa 100 req</text>
      <text x="24" y="90" font-family="monospace" font-size="10.5" fill="#f8fafc">  standardHeaders: true,</text>
      <text x="24" y="112" font-family="monospace" font-size="10.5" fill="#4ade80">  store: new RedisStore({</text>
      <text x="36" y="132" font-family="monospace" font-size="10.5" fill="#4ade80">    sendCommand: (...args) =&gt; ...</text>
      <text x="24" y="152" font-family="monospace" font-size="10.5" fill="#4ade80">  })</text>
      <text x="12" y="160" font-family="monospace" font-size="10.5" fill="#38bdf8">});</text>

      <!-- Outcome 1: Allow -->
      <rect y="180" width="290" height="95" rx="8" fill="#f0fdf4" stroke="#86efac" />
      <text x="12" y="204" font-family="sans-serif" font-weight="700" font-size="12" fill="#15803d">Khi còn Quota (&lt;= 100 req):</text>
      <text x="12" y="226" font-family="sans-serif" font-size="11" fill="#166534">• Cho phép next() đi vào Controller</text>
      <text x="12" y="246" font-family="monospace" font-size="10.5" fill="#15803d">• Headers: RateLimit-Remaining: 94</text>
      <text x="12" y="264" font-family="monospace" font-weight="700" font-size="10.5" fill="#15803d">• HTTP 200 OK</text>

      <!-- Outcome 2: Block 429 -->
      <rect y="285" width="290" height="85" rx="8" fill="#fef2f2" stroke="#fca5a5" />
      <text x="12" y="308" font-family="sans-serif" font-weight="700" font-size="12" fill="#991b1b">Khi vượt Quota (&gt; 100 req):</text>
      <text x="12" y="328" font-family="sans-serif" font-size="11" fill="#b91c1c">• Chặn đứng tại cổng, không chạm DB!</text>
      <text x="12" y="350" font-family="monospace" font-weight="800" font-size="11.5" fill="#dc2626">• HTTP 429 Too Many Requests</text>
    </g>
  </g>

  <!-- 3. In-Memory Redis Cluster (Right) -->
  <g transform="translate(680, 95)" filter="url(#rateShadow)">
    <rect width="280" height="425" rx="14" fill="#fff1f2" stroke="#e11d48" stroke-width="2.5" />
    <rect x="0" y="0" width="280" height="36" rx="14" fill="#e11d48" />
    <rect x="0" y="24" width="280" height="12" fill="#e11d48" />
    <text x="140" y="24" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff">🔴 Bộ Nhớ Đệm Redis (In-Memory)</text>

    <text x="140" y="65" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="13" fill="#9f1239">Sliding Window Counter</text>

    <!-- Key-Value in Redis -->
    <g transform="translate(15, 80)">
      <rect width="250" height="120" rx="8" fill="#ffffff" stroke="#fecdd3" />
      <text x="15" y="25" font-family="monospace" font-weight="700" font-size="11" fill="#be123c">KEY: rl:ip:118.69.15.2</text>
      <text x="15" y="48" font-family="monospace" font-size="11" fill="#e11d48">COUNT: 104 (BLOCKED)</text>
      <text x="15" y="70" font-family="monospace" font-size="11" fill="#881337">TTL: 280 seconds</text>
      
      <rect x="15" y="85" width="220" height="24" rx="4" fill="#ffe4e6" />
      <text x="125" y="101" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#9f1239">Tự hết hạn sau 15 phút</text>
    </g>

    <rect x="15" y="215" width="250" height="190" rx="8" fill="#ffffff" stroke="#fecdd3" />
    <text x="15" y="240" font-family="sans-serif" font-weight="700" font-size="12" fill="#9f1239">⚡ Vì sao phải dùng Redis?</text>
    <text x="15" y="265" font-family="sans-serif" font-size="11" fill="#475569">1. <tspan font-weight="700">Tốc độ &lt; 1ms:</tspan> Lưu trong RAM,</text>
    <text x="25" y="285" font-family="sans-serif" font-size="11" fill="#475569">không làm nghẽn máy chủ.</text>
    <text x="15" y="310" font-family="sans-serif" font-size="11" fill="#475569">2. <tspan font-weight="700">Chia sẻ giữa nhiều Node:</tspan></text>
    <text x="25" y="330" font-family="sans-serif" font-size="11" fill="#475569">Khi chạy 5 máy chủ Node.js,</text>
    <text x="25" y="350" font-family="sans-serif" font-size="11" fill="#475569">tất cả dùng chung bộ đếm!</text>
    <text x="15" y="380" font-family="sans-serif" font-weight="700" font-size="11" fill="#e11d48">3. Tự động dọn dẹp với TTL</text>
  </g>

  <!-- Connectors -->
  <path d="M 280 250 L 315 250" stroke="#a855f7" stroke-width="2.5" marker-end="url(#arrowGreenRate)" />
  <path d="M 640 250 L 675 250" stroke="#e11d48" stroke-width="2.5" marker-end="url(#arrowRedRate)" />
</svg>
