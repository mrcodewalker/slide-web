<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <filter id="ecoShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrowIndigo" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#6366f1" />
    </marker>
    <linearGradient id="headerGradEco" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <rect width="1000" height="580" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="64" rx="16" fill="url(#headerGradEco)" />
  <rect x="0" y="44" width="1000" height="20" fill="#4338ca" />
  <text x="500" y="32" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="20" fill="#ffffff">HỆ SINH THÁI TỰ ĐỘNG SINH CLIENT SDK TỪ OPENAPI 3.0</text>
  <text x="500" y="52" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e0e7ff">Bản hợp đồng API Contract duy nhất sinh mã nguồn Client typed chuẩn xác cho mọi nền tảng</text>

  <!-- CENTER: Single Source of Truth: OpenAPI Spec (swagger.json) -->
  <g transform="translate(360, 95)" filter="url(#ecoShadow)">
    <rect width="280" height="180" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2.5" />
    <rect x="0" y="0" width="280" height="36" rx="14" fill="#8b5cf6" />
    <rect x="0" y="24" width="280" height="12" fill="#8b5cf6" />
    <text x="140" y="24" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff">📜 OpenAPI 3.0 Specification</text>

    <text x="140" y="68" text-anchor="middle" font-family="monospace" font-weight="700" font-size="14" fill="#4c1d95">openapi.json / yaml</text>
    <text x="140" y="92" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6d28d9">Single Source of Truth</text>

    <rect x="20" y="110" width="240" height="50" rx="6" fill="#ede9fe" />
    <text x="140" y="132" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="11" fill="#5b21b6">openapitools/generator-cli</text>
    <text x="140" y="150" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b21a8">Tự động biên dịch sang 50+ ngôn ngữ</text>
  </g>

  <!-- 4 CLIENT SDK TARGET CARDS (Bottom row) -->
  <!-- Target 1: TypeScript Web (React/Vue/Angular) -->
  <g transform="translate(40, 330)" filter="url(#ecoShadow)">
    <rect width="210" height="210" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
    <rect x="0" y="0" width="210" height="34" rx="12" fill="#3b82f6" />
    <rect x="0" y="22" width="210" height="12" fill="#3b82f6" />
    <text x="105" y="22" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff">🌐 Web Front-end</text>

    <text x="105" y="62" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="13" fill="#1e3a8a">TypeScript / Axios</text>
    <rect x="15" y="80" width="180" height="75" rx="6" fill="#ffffff" stroke="#bfdbfe" />
    <text x="25" y="102" font-family="monospace" font-size="10" fill="#2563eb">interface Post {</text>
    <text x="35" y="120" font-family="monospace" font-size="10" fill="#2563eb">  id: number;</text>
    <text x="35" y="138" font-family="monospace" font-size="10" fill="#2563eb">  title: string; }</text>
    
    <text x="105" y="180" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="11" fill="#1d4ed8">Type-Safe 100%</text>
    <text x="105" y="198" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Tự sinh gợi ý code IDE</text>
  </g>

  <!-- Target 2: Flutter / Dart (Cross-platform Mobile) -->
  <g transform="translate(275, 330)" filter="url(#ecoShadow)">
    <rect width="210" height="210" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2" />
    <rect x="0" y="0" width="210" height="34" rx="12" fill="#14b8a6" />
    <rect x="0" y="22" width="210" height="12" fill="#14b8a6" />
    <text x="105" y="22" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff">📱 Mobile Flutter</text>

    <text x="105" y="62" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="13" fill="#0f766e">Dart Client SDK</text>
    <rect x="15" y="80" width="180" height="75" rx="6" fill="#ffffff" stroke="#99f6e4" />
    <text x="25" y="102" font-family="monospace" font-size="10" fill="#0d9488">class PostModel {</text>
    <text x="35" y="120" font-family="monospace" font-size="10" fill="#0d9488">  final int id;</text>
    <text x="35" y="138" font-family="monospace" font-size="10" fill="#0d9488">  fromJson(json); }</text>

    <text x="105" y="180" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="11" fill="#0f766e">Dart Cho iOS/Android</text>
    <text x="105" y="198" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Không gõ tay model</text>
  </g>

  <!-- Target 3: Kotlin / Java (Android Native) -->
  <g transform="translate(510, 330)" filter="url(#ecoShadow)">
    <rect width="210" height="210" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2" />
    <rect x="0" y="0" width="210" height="34" rx="12" fill="#a855f7" />
    <rect x="0" y="22" width="210" height="12" fill="#a855f7" />
    <text x="105" y="22" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff">🤖 Android Native</text>

    <text x="105" y="62" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="13" fill="#6b21a8">Kotlin Retrofit SDK</text>
    <rect x="15" y="80" width="180" height="75" rx="6" fill="#ffffff" stroke="#e9d5ff" />
    <text x="25" y="102" font-family="monospace" font-size="10" fill="#7e22ce">@GET("posts")</text>
    <text x="25" y="120" font-family="monospace" font-size="10" fill="#7e22ce">suspend fun getPosts():</text>
    <text x="35" y="138" font-family="monospace" font-size="10" fill="#7e22ce">  Response&lt;List&lt;Post&gt;&gt;</text>

    <text x="105" y="180" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="11" fill="#7e22ce">Coroutine Ready</text>
    <text x="105" y="198" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Chuẩn Google Android</text>
  </g>

  <!-- Target 4: Swift (iOS Native) -->
  <g transform="translate(745, 330)" filter="url(#ecoShadow)">
    <rect width="215" height="210" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2" />
    <rect x="0" y="0" width="215" height="34" rx="12" fill="#f97316" />
    <rect x="0" y="22" width="215" height="12" fill="#f97316" />
    <text x="107" y="22" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff">🍏 iOS Native</text>

    <text x="107" y="62" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="13" fill="#c2410c">Swift URLSession</text>
    <rect x="15" y="80" width="185" height="75" rx="6" fill="#ffffff" stroke="#fed7aa" />
    <text x="25" y="102" font-family="monospace" font-size="10" fill="#ea580c">struct Post: Codable {</text>
    <text x="35" y="120" font-family="monospace" font-size="10" fill="#ea580c">  let id: Int</text>
    <text x="35" y="138" font-family="monospace" font-size="10" fill="#ea580c">  let title: String }</text>

    <text x="107" y="180" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="11" fill="#ea580c">Swift Async/Await</text>
    <text x="107" y="198" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Đồng bộ tức thì</text>
  </g>

  <!-- Connectors from Center Spec to 4 targets -->
  <path d="M 400 275 L 145 325" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowIndigo)" />
  <path d="M 460 275 L 380 325" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowIndigo)" />
  <path d="M 540 275 L 615 325" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowIndigo)" />
  <path d="M 600 275 L 852 325" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowIndigo)" />
</svg>
