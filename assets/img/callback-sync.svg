<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" height="100%">
  <defs>
    <linearGradient id="syncGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="syncRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="syncGrey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="shadowSync" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="680" height="320" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="340" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#f87171" letter-spacing="0.5">
    ⛔ MÔ HÌNH ĐỒNG BỘ (SYNCHRONOUS - BLOCKING)
  </text>
  <text x="340" y="54" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">
    Một tác vụ I/O chiếm dụng luồng khiến toàn bộ hệ thống bị đứng chờ
  </text>

  <!-- Timeline Axis -->
  <line x1="60" y1="230" x2="620" y2="230" stroke="#475569" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="625" y="234" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Thời gian (t) →</text>

  <!-- Request 1 Track -->
  <text x="60" y="90" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#cbd5e1">Request 1:</text>
  
  <!-- Step 1: JS Exec -->
  <g filter="url(#shadowSync)">
    <rect x="140" y="72" width="90" height="42" rx="6" fill="url(#syncGreen)"/>
    <text x="185" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff">Nhận Request</text>
    <text x="185" y="106" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#d1fae5">Chạy JS (5ms)</text>
  </g>

  <!-- Step 2: Blocking I/O -->
  <g filter="url(#shadowSync)">
    <rect x="235" y="72" width="230" height="42" rx="6" fill="url(#syncRed)" stroke="#f87171" stroke-width="1.5"/>
    <text x="350" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fff">CHẶN LUỒNG (BLOCKING)</text>
    <text x="350" y="106" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#fee2e2">Đợi Đọc đĩa SSD / CSDL MySQL (100ms)</text>
  </g>

  <!-- Step 3: Response -->
  <g filter="url(#shadowSync)">
    <rect x="470" y="72" width="100" height="42" rx="6" fill="url(#syncGreen)"/>
    <text x="520" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff">Trả Response</text>
    <text x="520" y="106" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#d1fae5">Xong Req 1</text>
  </g>

  <!-- Request 2 Track (Blocked) -->
  <text x="60" y="160" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f87171">Request 2:</text>
  <text x="60" y="176" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">(Đến lúc t=30ms)</text>

  <!-- Blocked waiting bar -->
  <g filter="url(#shadowSync)">
    <rect x="240" y="145" width="225" height="40" rx="6" fill="#1e293b" stroke="#ef4444" stroke-dasharray="6,4" stroke-width="1.5"/>
    <text x="352" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fca5a5">⏳ BỊ TREO CHỜ (BLOCKED)</text>
    <text x="352" y="177" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Luồng CPU đang bận, không thể phục vụ!</text>
  </g>

  <g filter="url(#shadowSync)">
    <rect x="470" y="145" width="100" height="40" rx="6" fill="url(#syncGrey)"/>
    <text x="520" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff">Mới được xử lý</text>
    <text x="520" y="177" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">Bị trễ rất lâu!</text>
  </g>

  <!-- Bottom Alert Bar -->
  <rect x="40" y="260" width="600" height="42" rx="8" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
  <text x="340" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#fecaca">
    ⚠️ Hậu quả: 1 request đọc file nặng làm đơ toàn bộ máy chủ, ngốn nhiều RAM nếu mở đa luồng.
  </text>
</svg>
