<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <filter id="envShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <linearGradient id="headerGradEnv" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>

  <rect width="1000" height="580" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="64" rx="16" fill="url(#headerGradEnv)" />
  <rect x="0" y="44" width="1000" height="20" fill="#312e81" />
  <text x="500" y="32" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="20" fill="#ffffff">QUẢN TRỊ BIẾN MÔI TRƯỜNG &amp; SECRETS AN TOÀN TRÊN CLOUD</text>
  <text x="500" y="52" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c7d2fe">Bảo vệ mật khẩu Database và khóa JWT — Không bao giờ lưu mật khẩu nhạy cảm trên GitHub</text>

  <!-- DASHBOARD MOCKUP -->
  <g transform="translate(45, 85)" filter="url(#envShadow)">
    <rect width="910" height="465" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8" />
    
    <!-- Render Dashboard Top Bar -->
    <rect x="0" y="0" width="910" height="42" rx="12" fill="#1e1e38" />
    <rect x="0" y="24" width="910" height="18" fill="#1e1e38" />
    <text x="25" y="26" font-family="sans-serif" font-weight="800" font-size="13" fill="#818cf8">Render Dashboard</text>
    <text x="175" y="26" font-family="sans-serif" font-size="12" fill="#94a3b8">/ devblog-api /</text>
    <text x="285" y="26" font-family="sans-serif" font-weight="700" font-size="12" fill="#ffffff">Environment Variables</text>

    <!-- Top Action Bar -->
    <g transform="translate(25, 55)">
      <text x="0" y="22" font-family="sans-serif" font-weight="800" font-size="15" fill="#0f172a">Environment Variables &amp; Secret Files</text>
      <text x="0" y="42" font-family="sans-serif" font-size="12" fill="#64748b">Các biến này sẽ được nạp trực tiếp vào <tspan font-family="monospace" font-weight="700" fill="#4f46e5">process.env</tspan> khi máy chủ khởi động.</text>
      
      <rect x="715" y="5" width="145" height="34" rx="6" fill="#4f46e5" />
      <text x="787" y="27" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="12" fill="#ffffff">+ Add Variable</text>
    </g>

    <!-- Secrets Table -->
    <g transform="translate(25, 125)">
      <!-- Table Header -->
      <rect width="860" height="36" rx="6" fill="#f1f5f9" />
      <text x="20" y="23" font-family="sans-serif" font-weight="700" font-size="11" fill="#475569">KEY (TÊN BIẾN MÔI TRƯỜNG)</text>
      <text x="340" y="23" font-family="sans-serif" font-weight="700" font-size="11" fill="#475569">VALUE (GIÁ TRỊ CẤU HÌNH)</text>
      <text x="740" y="23" font-family="sans-serif" font-weight="700" font-size="11" fill="#475569">TRẠNG THÁI</text>

      <!-- Row 1: NODE_ENV -->
      <g transform="translate(0, 42)">
        <rect width="860" height="42" fill="#ffffff" />
        <line x1="0" y1="42" x2="860" y2="42" stroke="#e2e8f0" />
        <text x="20" y="26" font-family="monospace" font-weight="700" font-size="12" fill="#1e293b">NODE_ENV</text>
        <text x="340" y="26" font-family="monospace" font-size="12" fill="#2563eb">production</text>
        <rect x="740" y="10" width="80" height="22" rx="4" fill="#dbeafe" />
        <text x="780" y="25" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#1e40af">PUBLIC</text>
      </g>

      <!-- Row 2: PORT -->
      <g transform="translate(0, 84)">
        <rect width="860" height="42" fill="#f8fafc" />
        <line x1="0" y1="42" x2="860" y2="42" stroke="#e2e8f0" />
        <text x="20" y="26" font-family="monospace" font-weight="700" font-size="12" fill="#1e293b">PORT</text>
        <text x="340" y="26" font-family="monospace" font-size="12" fill="#64748b">10000 (Auto-assigned)</text>
        <rect x="740" y="10" width="80" height="22" rx="4" fill="#e2e8f0" />
        <text x="780" y="25" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#475569">SYSTEM</text>
      </g>

      <!-- Row 3: DB_HOST -->
      <g transform="translate(0, 126)">
        <rect width="860" height="42" fill="#ffffff" />
        <line x1="0" y1="42" x2="860" y2="42" stroke="#e2e8f0" />
        <text x="20" y="26" font-family="monospace" font-weight="700" font-size="12" fill="#1e293b">DB_HOST</text>
        <text x="340" y="26" font-family="monospace" font-size="12" fill="#0f766e">mysql-cloud-vn.aivencloud.com</text>
        <rect x="740" y="10" width="80" height="22" rx="4" fill="#ccfbf1" />
        <text x="780" y="25" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f766e">ACTIVE</text>
      </g>

      <!-- Row 4: DB_PASS (Hidden secret) -->
      <g transform="translate(0, 168)">
        <rect width="860" height="42" fill="#fef2f2" />
        <line x1="0" y1="42" x2="860" y2="42" stroke="#e2e8f0" />
        <text x="20" y="26" font-family="monospace" font-weight="700" font-size="12" fill="#991b1b">DB_PASS</text>
        <text x="340" y="26" font-family="monospace" font-size="14" fill="#dc2626">••••••••••••••••••••</text>
        <rect x="740" y="10" width="80" height="22" rx="4" fill="#fee2e2" />
        <text x="780" y="25" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#b91c1c">ENCRYPTED</text>
      </g>

      <!-- Row 5: JWT_SECRET (Hidden secret) -->
      <g transform="translate(0, 210)">
        <rect width="860" height="42" fill="#fef2f2" />
        <line x1="0" y1="42" x2="860" y2="42" stroke="#e2e8f0" />
        <text x="20" y="26" font-family="monospace" font-weight="700" font-size="12" fill="#991b1b">JWT_SECRET</text>
        <text x="340" y="26" font-family="monospace" font-size="14" fill="#dc2626">••••••••••••••••••••</text>
        <rect x="740" y="10" width="80" height="22" rx="4" fill="#fee2e2" />
        <text x="780" y="25" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#b91c1c">ENCRYPTED</text>
      </g>
    </g>

    <!-- Bottom Note Callout -->
    <g transform="translate(25, 400)">
      <rect width="860" height="52" rx="8" fill="#ede9fe" stroke="#c4b5fd" />
      <text x="18" y="24" font-family="sans-serif" font-weight="700" font-size="12" fill="#5b21b6">🛡️ Nguyên Tắc Vàng Của DevOps &amp; Cloud Security:</text>
      <text x="18" y="42" font-family="sans-serif" font-size="11" fill="#6d28d9">Không bao giờ commit file `.env` chứa mật khẩu thật lên Git. Mọi giá trị bí mật chỉ được lưu trên Cloud Dashboard!</text>
    </g>
  </g>
</svg>
