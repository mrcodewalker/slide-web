<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <filter id="multiShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="1000" height="560" fill="none" />

  <text x="500" y="38" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="22" fill="#0f172a">CƠ CHẾ STREAM MULTIPART/FORM-DATA &amp; MULTER</text>
  <text x="500" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#64748b">Bóc tách các trường chuỗi và file nhị phân qua chuỗi phân cách Boundary ngẫu nhiên</text>

  <!-- Left: Raw Multipart Payload -->
  <g transform="translate(60, 105)" filter="url(#multiShadow)">
    <rect width="420" height="400" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.8" />
    <path d="M 0 16 Q 0 0 16 0 L 404 0 Q 420 0 420 16 L 420 44 L 0 44 Z" fill="#1e293b" />
    <text x="210" y="28" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#38bdf8">HTTP Request Body (Stream)</text>

    <text x="20" y="75" font-family="monospace" font-size="11.5" fill="#f43f5e">--WebKitFormBoundary7MA4YWxkTrZu0gW</text>
    <text x="20" y="98" font-family="monospace" font-size="11" fill="#cbd5e1">Content-Disposition: form-data; name="title"</text>
    <text x="20" y="125" font-family="monospace" font-size="12" font-weight="700" fill="#34d399">Học NodeJS Express</text>

    <text x="20" y="165" font-family="monospace" font-size="11.5" fill="#f43f5e">--WebKitFormBoundary7MA4YWxkTrZu0gW</text>
    <text x="20" y="188" font-family="monospace" font-size="11" fill="#cbd5e1">Content-Disposition: form-data; name="cover"; filename="avatar.png"</text>
    <text x="20" y="210" font-family="monospace" font-size="11" fill="#93c5fd">Content-Type: image/png</text>
    
    <!-- Binary bytes block -->
    <rect x="20" y="225" width="380" height="90" rx="6" fill="#1e293b" />
    <text x="30" y="250" font-family="monospace" font-size="11" fill="#64748b">[Binary Data Stream]</text>
    <text x="30" y="272" font-family="monospace" font-size="11" fill="#f59e0b">89 50 4E 47 0D 0A 1A 0A 00 00 00 0D 49 48 44 52...</text>
    <text x="30" y="295" font-family="monospace" font-size="10.5" fill="#a7f3d0">Magic Bytes: 89 50 4E 47 (Xác thực chuẩn PNG!)</text>

    <text x="20" y="340" font-family="monospace" font-size="11.5" fill="#f43f5e">--WebKitFormBoundary7MA4YWxkTrZu0gW--</text>
    <text x="20" y="380" font-family="sans-serif" font-size="11" fill="#94a3b8">⚠️ express.json() không đọc được định dạng này!</text>
  </g>

  <!-- Right: Multer Pipeline Processing -->
  <g transform="translate(520, 105)" filter="url(#multiShadow)">
    <rect width="420" height="400" rx="16" fill="#ffffff" stroke="#0ea5e9" stroke-width="2" />
    <path d="M 0 16 Q 0 0 16 0 L 404 0 Q 420 0 420 16 L 420 44 L 0 44 Z" fill="#f0f9ff" />
    <text x="210" y="28" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="14" fill="#0369a1">MULTER MIDDLEWARE XỬ LÝ</text>

    <!-- Block 1: Parse Text -->
    <g transform="translate(20, 65)">
      <rect width="380" height="70" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
      <text x="20" y="30" font-family="sans-serif" font-weight="700" font-size="13" fill="#0f172a">1. Trích xuất Text Fields ➔ req.body</text>
      <text x="20" y="52" font-family="monospace" font-size="11.5" fill="#0284c7">req.body.title = "Học NodeJS Express"</text>
    </g>

    <!-- Block 2: Filter & Save File -->
    <g transform="translate(20, 150)">
      <rect width="380" height="110" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
      <text x="20" y="28" font-family="sans-serif" font-weight="700" font-size="13" fill="#15803d">2. Kiểm tra &amp; Ghi File ➔ req.file</text>
      <text x="20" y="50" font-family="sans-serif" font-size="11.5" fill="#166534">• fileFilter: Đúng định dạng JPG, PNG, WebP?</text>
      <text x="20" y="70" font-family="sans-serif" font-size="11.5" fill="#166534">• limits: Dung lượng &lt; 2MB?</text>
      <text x="20" y="92" font-family="monospace" font-size="11" fill="#15803d">req.file = { path, filename, size, mimetype }</text>
    </g>

    <!-- Block 3: Sharp Optimization -->
    <g transform="translate(20, 275)">
      <rect width="380" height="95" rx="10" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1.5" />
      <text x="20" y="28" font-family="sans-serif" font-weight="700" font-size="13" fill="#a21caf">3. Tối ưu ảnh với Sharp (Khuyên dùng)</text>
      <text x="20" y="52" font-family="sans-serif" font-size="11.5" fill="#86198f">• Resize kích thước chuẩn (1200x630)</text>
      <text x="20" y="72" font-family="sans-serif" font-size="11.5" fill="#86198f">• Nén định dạng WebP chất lượng 80% (Giảm 80% dung lượng)</text>
    </g>
  </g>
</svg>