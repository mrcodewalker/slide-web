      <text x="650" y="29" font-family="sans-serif" font-weight="700" font-size="12" fill="#15803d">100%</text>
      <text x="750" y="29" font-family="sans-serif" font-weight="700" font-size="12" fill="#15803d">92.8%</text>
      <text x="840" y="29" font-family="sans-serif" font-size="11" fill="#64748b">45, 52</text>
