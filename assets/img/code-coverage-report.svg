    <text x="25" y="320" font-family="sans-serif" font-size="12" fill="#64748b">💡 Lệnh chạy: <tspan font-family="monospace" font-weight="700" fill="#0f172a">npx jest --coverage</tspan> ➔ Xem file chi tiết tại: <tspan font-family="monospace" fill="#0284c7">coverage/lcov-report/index.html</tspan></text>
