      <text x="430" y="29" font-family="sans-serif" font-weight="700" font-size="12" fill="#dc2626">72.7%</text>
      <text x="545" y="29" font-family="sans-serif" font-weight="700" font-size="12" fill="#dc2626">66.7%</text>
      <text x="650" y="29" font-family="sans-serif" font-weight="700" font-size="12" fill="#ca8a04">80.0%</text>
      <text x="750" y="29" font-family="sans-serif" font-weight="700" font-size="12" fill="#dc2626">71.4%</text>
      <text x="840" y="29" font-family="monospace" font-weight="700" font-size="11" fill="#dc2626">34-42, 60</text>
