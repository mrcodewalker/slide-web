  <rect x="0" y="44" width="1000" height="20" fill="#065f46" />
  <text x="500" y="32" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="20" fill="#ffffff">BẢNG BÁO CÁO ĐỘ BAO PHỦ MÃ NGUỒN (JEST CODE COVERAGE)</text>
  <text x="500" y="52" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#a7f3d0">Đo lường chính xác tỷ lệ code được thực thi bởi bộ kiểm thử tự động (Statements, Branch, Funcs, Lines)</text>

  <!-- 4 SUMMARY CARDS (Top row) -->
  <!-- Card 1: Statements -->
  <g transform="translate(40, 85)" filter="url(#covShadow)">
    <rect width="210" height="95" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
    <text x="20" y="30" font-family="sans-serif" font-weight="700" font-size="13" fill="#047857">Statements</text>
    <text x="20" y="68" font-family="sans-serif" font-weight="800" font-size="32" fill="#065f46">89.4%</text>
    <rect x="135" y="45" width="60" height="24" rx="6" fill="#10b981" />
    <text x="165" y="62" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="11" fill="#ffffff">PASS</text>
  </g>

  <!-- Card 2: Branches -->
  <g transform="translate(275, 85)" filter="url(#covShadow)">
    <rect width="210" height="95" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
    <text x="20" y="30" font-family="sans-serif" font-weight="700" font-size="13" fill="#047857">Branches (if/else)</text>
    <text x="20" y="68" font-family="sans-serif" font-weight="800" font-size="32" fill="#065f46">82.1%</text>
    <rect x="135" y="45" width="60" height="24" rx="6" fill="#10b981" />
    <text x="165" y="62" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="11" fill="#ffffff">PASS</text>
  </g>

  <!-- Card 3: Functions -->
  <g transform="translate(510, 85)" filter="url(#covShadow)">
    <rect width="210" height="95" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
    <text x="20" y="30" font-family="sans-serif" font-weight="700" font-size="13" fill="#047857">Functions</text>
    <text x="20" y="68" font-family="sans-serif" font-weight="800" font-size="32" fill="#065f46">92.5%</text>
    <rect x="135" y="45" width="60" height="24" rx="6" fill="#10b981" />
    <text x="165" y="62" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="11" fill="#ffffff">PASS</text>
