      <line x1="0" y1="48" x2="920" y2="48" stroke="#e2e8f0" />
      <text x="25" y="29" font-family="monospace" font-weight="700" font-size="12" fill="#1e293b">src/controllers/auth.controller.js</text>
      <text x="430" y="29" font-family="sans-serif" font-weight="700" font-size="12" fill="#15803d">91.6%</text>
      <text x="545" y="29" font-family="sans-serif" font-weight="700" font-size="12" fill="#ca8a04">75.0%</text>
      <text x="650" y="29" font-family="sans-serif" font-weight="700" font-size="12" fill="#15803d">100%</text>
      <text x="750" y="29" font-family="sans-serif" font-weight="700" font-size="12" fill="#15803d">90.9%</text>
      <text x="840" y="29" font-family="sans-serif" font-size="11" fill="#64748b">78-83</text>
