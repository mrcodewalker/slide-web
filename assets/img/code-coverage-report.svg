      <rect width="920" height="52" fill="#e2e8f0" />
      <text x="25" y="32" font-family="sans-serif" font-weight="800" font-size="13" fill="#0f172a">All files (Tổng quan toàn bộ dự án)</text>
      <text x="430" y="32" font-family="sans-serif" font-weight="800" font-size="13" fill="#15803d">89.4%</text>
      <text x="545" y="32" font-family="sans-serif" font-weight="800" font-size="13" fill="#15803d">82.1%</text>
      <text x="650" y="32" font-family="sans-serif" font-weight="800" font-size="13" fill="#15803d">92.5%</text>
      <text x="750" y="32" font-family="sans-serif" font-weight="800" font-size="13" fill="#15803d">88.7%</text>
