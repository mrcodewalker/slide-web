<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <filter id="mwShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="mwArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="1000" height="560" fill="none" />
  <text x="500" y="38" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="22" fill="#0f172a">ĐƯỜNG ỐNG PIPELINE MIDDLEWARE TRONG EXPRESS.JS</text>
  <text x="500" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#64748b">Request chảy tuần tự qua các hàm trung gian: app.use() ➔ next() ➔ Controller</text>

  <!-- Incoming Request -->
  <g transform="translate(40, 150)">
    <rect width="110" height="220" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#mwShadow)" />
    <text x="55" y="100" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="14" fill="#0369a1">HTTP</text>
    <text x="55" y="125" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="14" fill="#0369a1">REQUEST</text>
    <text x="55" y="155" text-anchor="middle" font-family="monospace" font-size="11" fill="#475569">POST /api</text>
  </g>

  <line x1="150" y1="260" x2="200" y2="260" stroke="#0284c7" stroke-width="3" marker-end="url(#mwArr)" />

  <!-- Middleware 1: Logger -->
  <g transform="translate(200, 130)" filter="url(#mwShadow)">
    <rect width="150" height="260" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <path d="M 0 14 Q 0 0 14 0 L 136 0 Q 150 0 150 14 L 150 40 L 0 40 Z" fill="#f1f5f9" />
    <text x="75" y="26" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#334155">1. morgan()</text>
    <text x="15" y="65" font-family="sans-serif" font-weight="700" font-size="12" fill="#0f172a">Ghi nhật ký Log</text>
    <text x="15" y="90" font-family="monospace" font-size="10.5" fill="#475569">console.log(req)</text>
    <text x="15" y="150" font-family="sans-serif" font-size="11" fill="#64748b">Đo thời gian phản hồi response time</text>
    <rect x="15" y="200" width="120" height="36" rx="8" fill="#dcfce7" />
    <text x="75" y="223" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#15803d">next()</text>
  </g>

  <line x1="350" y1="260" x2="390" y2="260" stroke="#0284c7" stroke-width="3" marker-end="url(#mwArr)" />

  <!-- Middleware 2: JSON Parser -->
  <g transform="translate(390, 130)" filter="url(#mwShadow)">
    <rect width="150" height="260" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="2" />
    <path d="M 0 14 Q 0 0 14 0 L 136 0 Q 150 0 150 14 L 150 40 L 0 40 Z" fill="#eff6ff" />
    <text x="75" y="26" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#1d4ed8">2. express.json()</text>
    <text x="15" y="65" font-family="sans-serif" font-weight="700" font-size="12" fill="#0f172a">Phân tích Body</text>
    <text x="15" y="90" font-family="monospace" font-size="10.5" fill="#475569">Buffer ➔ JSON</text>
    <text x="15" y="150" font-family="sans-serif" font-size="11" fill="#64748b">Gán object vào req.body</text>
    <rect x="15" y="200" width="120" height="36" rx="8" fill="#dcfce7" />
    <text x="75" y="223" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#15803d">next()</text>
  </g>

  <line x1="540" y1="260" x2="580" y2="260" stroke="#0284c7" stroke-width="3" marker-end="url(#mwArr)" />

  <!-- Middleware 3: Auth -->
  <g transform="translate(580, 130)" filter="url(#mwShadow)">
    <rect width="150" height="260" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" />
    <path d="M 0 14 Q 0 0 14 0 L 136 0 Q 150 0 150 14 L 150 40 L 0 40 Z" fill="#f5f3ff" />
    <text x="75" y="26" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#6d28d9">3. authGuard()</text>
    <text x="15" y="65" font-family="sans-serif" font-weight="700" font-size="12" fill="#0f172a">Xác thực Token</text>
    <text x="15" y="90" font-family="monospace" font-size="10.5" fill="#475569">Bearer &lt;JWT&gt;</text>
    <text x="15" y="150" font-family="sans-serif" font-size="11" fill="#64748b">Gán thông tin user vào req.user</text>
    <rect x="15" y="200" width="120" height="36" rx="8" fill="#dcfce7" />
    <text x="75" y="223" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#15803d">next()</text>
  </g>

  <line x1="730" y1="260" x2="770" y2="260" stroke="#0284c7" stroke-width="3" marker-end="url(#mwArr)" />

  <!-- Handler: Controller -->
  <g transform="translate(770, 130)" filter="url(#mwShadow)">
    <rect width="180" height="260" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2.5" />
    <path d="M 0 14 Q 0 0 14 0 L 166 0 Q 180 0 180 14 L 180 40 L 0 40 Z" fill="#f0fdf4" />
    <text x="90" y="26" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="13" fill="#15803d">4. Controller Handler</text>
    <text x="15" y="65" font-family="sans-serif" font-weight="700" font-size="12" fill="#0f172a">Xử lý nghiệp vụ</text>
    <text x="15" y="90" font-family="monospace" font-size="10.5" fill="#475569">postService.create()</text>
    <text x="15" y="130" font-family="sans-serif" font-size="11" fill="#64748b">Lưu vào Database</text>
    
    <rect x="15" y="190" width="150" height="46" rx="8" fill="#16a34a" />
    <text x="90" y="218" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#ffffff">res.status(201)</text>
  </g>

  <!-- Error Path -->
  <path d="M 655 390 L 655 450 L 500 450" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4" />
  <rect x="340" y="430" width="320" height="40" rx="8" fill="#fef2f2" stroke="#fca5a5" />
  <text x="500" y="455" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b91c1c">Nếu ném lỗi: Bỏ qua các bước tiếp ➔ errorHandler</text>
</svg>