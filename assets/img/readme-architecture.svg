<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <filter id="readmeShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <linearGradient id="headerGradReadme" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <rect width="1000" height="580" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="64" rx="16" fill="url(#headerGradReadme)" />
  <rect x="0" y="44" width="1000" height="20" fill="#1e293b" />
  <text x="500" y="32" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="20" fill="#ffffff">CẤU TRÚC 6 KHỐI CỦA MỘT FILE README.MD SENIOR CHUẨN MỰC</text>
  <text x="500" y="52" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#cbd5e1">Bộ mặt dự án trên GitHub — Gây ấn tượng mạnh mẽ với nhà tuyển dụng trong 30 giây đầu tiên</text>

  <!-- GITHUB README MOCKUP CONTAINER -->
  <g transform="translate(50, 85)" filter="url(#readmeShadow)">
    <rect width="900" height="465" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8" />
    
    <!-- GitHub File Header Bar -->
    <rect x="0" y="0" width="900" height="38" rx="12" fill="#f8fafc" stroke="#e2e8f0" />
    <rect x="0" y="24" width="900" height="14" fill="#f8fafc" />
    <circle cx="20" cy="19" r="5" fill="#ef4444" />
    <circle cx="36" cy="19" r="5" fill="#eab308" />
    <circle cx="52" cy="19" r="5" fill="#22c55e" />
    <text x="80" y="23" font-family="monospace" font-weight="700" font-size="12" fill="#475569">README.md — devblog-rest-api (main)</text>

    <!-- Block 1: Badges & Hero -->
    <g transform="translate(30, 52)">
      <!-- Badges -->
      <g transform="translate(0, 0)">
        <rect width="115" height="22" rx="4" fill="#2563eb" />
        <text x="57" y="15" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">build | passing</text>

        <rect x="125" width="110" height="22" rx="4" fill="#10b981" />
        <text x="180" y="15" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">coverage | 89%</text>

        <rect x="245" width="95" height="22" rx="4" fill="#8b5cf6" />
        <text x="292" y="15" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">node | &gt;=20.x</text>

        <rect x="350" width="85" height="22" rx="4" fill="#f59e0b" />
        <text x="392" y="15" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">license | MIT</text>
      </g>
      
      <text x="0" y="48" font-family="sans-serif" font-weight="900" font-size="20" fill="#0f172a"># DevBlog RESTful API Platform</text>
      <text x="0" y="70" font-family="sans-serif" font-size="12" fill="#475569">Hệ thống backend blog công nghệ hoàn chỉnh xây dựng bằng Node.js, Express, Sequelize ORM &amp; MySQL.</text>
      <line x1="0" y1="82" x2="840" y2="82" stroke="#e2e8f0" />
    </g>

    <!-- 2 Column Layout for Sections 2-6 -->
    <!-- Column Left: Tech Stack & Architecture -->
    <g transform="translate(30, 150)">
      <rect width="405" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="15" y="24" font-family="sans-serif" font-weight="800" font-size="13" fill="#1e293b">🛠️ 1. Tech Stack &amp; Features</text>
      <text x="15" y="48" font-family="sans-serif" font-size="11" fill="#334155">• <tspan font-weight="700">Core:</tspan> Node.js 20, Express 4.x</text>
      <text x="15" y="68" font-family="sans-serif" font-size="11" fill="#334155">• <tspan font-weight="700">Database &amp; ORM:</tspan> MySQL 8, Sequelize 6</text>
      <text x="15" y="88" font-family="sans-serif" font-size="11" fill="#334155">• <tspan font-weight="700">Auth &amp; Security:</tspan> JWT (Access + Refresh), Bcrypt, Helmet</text>
      <text x="15" y="108" font-family="sans-serif" font-size="11" fill="#334155">• <tspan font-weight="700">Testing &amp; Docs:</tspan> Jest, Supertest, Swagger OpenAPI 3.0</text>

      <rect y="132" width="405" height="135" rx="8" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="15" y="156" font-family="sans-serif" font-weight="800" font-size="13" fill="#1e40af">🏛️ 2. Clean Architecture &amp; ERD</text>
      <text x="15" y="180" font-family="sans-serif" font-size="11" fill="#1e3a8a">• Mô hình 4 lớp: Controller ➔ Service ➔ Repository ➔ Model</text>
      <text x="15" y="202" font-family="sans-serif" font-size="11" fill="#1e3a8a">• Sơ đồ ERD 5 bảng: Users, Roles, Posts, Categories, Comments</text>
      <text x="15" y="224" font-family="sans-serif" font-size="11" fill="#1e3a8a">• Đính kèm ảnh minh họa kiến trúc rõ nét ngay trong README</text>
      <text x="15" y="248" font-family="sans-serif" font-weight="700" font-size="11" fill="#2563eb">👉 Xem ảnh: docs/architecture.png</text>
    </g>

    <!-- Column Right: Quickstart & Live Demo -->
    <g transform="translate(465, 150)">
      <rect width="405" height="145" rx="8" fill="#0f172a" />
      <text x="15" y="24" font-family="sans-serif" font-weight="800" font-size="13" fill="#38bdf8">⚡ 3. Quick Start Installation</text>
      <text x="15" y="48" font-family="monospace" font-size="10" fill="#94a3b8"># 1. Clone repository</text>
      <text x="15" y="66" font-family="monospace" font-size="11" fill="#f8fafc">git clone https://github.com/user/devblog-api.git</text>
      <text x="15" y="86" font-family="monospace" font-size="10" fill="#94a3b8"># 2. Cài đặt &amp; copy env</text>
      <text x="15" y="104" font-family="monospace" font-size="11" fill="#f8fafc">npm install &amp;&amp; cp .env.example .env</text>
      <text x="15" y="124" font-family="monospace" font-size="10" fill="#94a3b8"># 3. Chạy migration &amp; khởi động</text>
      <text x="15" y="140" font-family="monospace" font-size="11" fill="#34d399">npx sequelize db:migrate &amp;&amp; npm run dev</text>

      <rect y="157" width="405" height="110" rx="8" fill="#ecfdf5" stroke="#a7f3d0" />
      <text x="15" y="181" font-family="sans-serif" font-weight="800" font-size="13" fill="#065f46">🌐 4. Live API &amp; Swagger Docs</text>
      <text x="15" y="204" font-family="sans-serif" font-size="11" fill="#047857">• Live Demo URL: <tspan font-family="monospace" font-weight="700" fill="#0f172a">https://devblog-api.onrender.com</tspan></text>
      <text x="15" y="226" font-family="sans-serif" font-size="11" fill="#047857">• Interactive Swagger UI: <tspan font-family="monospace" font-weight="700" fill="#2563eb">/api-docs</tspan></text>
      <text x="15" y="248" font-family="sans-serif" font-weight="700" font-size="11" fill="#059669">👤 Tác giả: Nguyễn Văn A (Fullstack Engineer) · LinkedIn Link</text>
    </g>
  </g>
</svg>
