<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <filter id="migShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrowRightMig" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#0284c7" />
    </marker>
    <linearGradient id="headerGradMig" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="1000" height="580" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="64" rx="16" fill="url(#headerGradMig)" />
  <rect x="0" y="44" width="1000" height="20" fill="#075985" />
  <text x="500" y="32" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="20" fill="#ffffff">QUY TRÌNH QUẢN LÝ PHIÊN BẢN CSDL (DATABASE MIGRATIONS)</text>
  <text x="500" y="52" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e0f2fe">Hệ thống Git dành riêng cho CSDL: Tự động hóa tiến hóa Schema (up) và khôi phục an toàn (down)</text>

  <!-- TIMELINE AXIS (Center Horizontal) -->
  <line x1="80" y1="210" x2="920" y2="210" stroke="#cbd5e1" stroke-width="4" />

  <!-- MIGRATION STEP 1: Create Users Table -->
  <g transform="translate(60, 95)" filter="url(#migShadow)">
    <circle cx="120" cy="115" r="20" fill="#0284c7" stroke="#ffffff" stroke-width="4" />
    <text x="120" y="121" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="12" fill="#ffffff">V1</text>

    <!-- Top Card (up action) -->
    <rect width="240" height="105" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
    <text x="120" y="24" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="12" fill="#1e3a8a">20261028-create-users.js</text>
    <rect x="20" y="36" width="200" height="55" rx="6" fill="#ffffff" stroke="#bfdbfe" />
    <text x="30" y="56" font-family="monospace" font-size="10.5" fill="#1d4ed8">up: queryInterface</text>
    <text x="40" y="74" font-family="monospace" font-size="10.5" fill="#1d4ed8">.createTable('Users')</text>

    <!-- Bottom Card (down rollback) -->
    <g transform="translate(0, 145)">
      <rect width="240" height="75" rx="8" fill="#fef2f2" stroke="#fca5a5" />
      <text x="120" y="24" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="11" fill="#991b1b">Hàm rollback: down()</text>
      <text x="120" y="48" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#dc2626">dropTable('Users')</text>
    </g>
  </g>

  <!-- MIGRATION STEP 2: Add Role Column -->
  <g transform="translate(380, 95)" filter="url(#migShadow)">
    <circle cx="120" cy="115" r="20" fill="#0284c7" stroke="#ffffff" stroke-width="4" />
    <text x="120" y="121" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="12" fill="#ffffff">V2</text>

    <!-- Top Card -->
    <rect width="240" height="105" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
    <text x="120" y="24" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="12" fill="#1e3a8a">20261029-add-role-to-users.js</text>
    <rect x="20" y="36" width="200" height="55" rx="6" fill="#ffffff" stroke="#bfdbfe" />
    <text x="30" y="56" font-family="monospace" font-size="10.5" fill="#1d4ed8">up: queryInterface</text>
    <text x="40" y="74" font-family="monospace" font-size="10.5" fill="#1d4ed8">.addColumn('Users', 'role')</text>

    <!-- Bottom Card -->
    <g transform="translate(0, 145)">
      <rect width="240" height="75" rx="8" fill="#fef2f2" stroke="#fca5a5" />
      <text x="120" y="24" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="11" fill="#991b1b">Hàm rollback: down()</text>
      <text x="120" y="48" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#dc2626">removeColumn('Users', 'role')</text>
    </g>
  </g>

  <!-- MIGRATION STEP 3: Create Posts Table -->
  <g transform="translate(700, 95)" filter="url(#migShadow)">
    <circle cx="120" cy="115" r="20" fill="#10b981" stroke="#ffffff" stroke-width="4" />
    <text x="120" y="121" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="12" fill="#ffffff">V3</text>

    <!-- Top Card -->
    <rect width="240" height="105" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
    <text x="120" y="24" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="12" fill="#065f46">20261030-create-posts.js</text>
    <rect x="20" y="36" width="200" height="55" rx="6" fill="#ffffff" stroke="#a7f3d0" />
    <text x="30" y="56" font-family="monospace" font-size="10.5" fill="#047857">up: queryInterface</text>
    <text x="40" y="74" font-family="monospace" font-size="10.5" fill="#047857">.createTable('Posts')</text>

    <!-- Bottom Card -->
    <g transform="translate(0, 145)">
      <rect width="240" height="75" rx="8" fill="#fef2f2" stroke="#fca5a5" />
      <text x="120" y="24" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="11" fill="#991b1b">Hàm rollback: down()</text>
      <text x="120" y="48" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#dc2626">dropTable('Posts')</text>
    </g>
  </g>

  <!-- BOTTOM: SequelizeMeta Table & Team Collaboration Flow -->
  <g transform="translate(60, 365)" filter="url(#migShadow)">
    <rect width="880" height="185" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" />
    
    <text x="25" y="32" font-family="sans-serif" font-weight="800" font-size="14" fill="#38bdf8">BẢNG LỊCH SỬ HỆ THỐNG: SequelizeMeta (TỰ ĐỘNG THEO DÕI PHIÊN BẢN)</text>
    
    <g transform="translate(25, 48)">
      <rect width="360" height="115" rx="6" fill="#1e293b" />
      <text x="15" y="24" font-family="monospace" font-weight="700" font-size="11" fill="#facc15">name (VARCHAR 255 - PRIMARY KEY)</text>
      <text x="15" y="48" font-family="monospace" font-size="10.5" fill="#4ade80">✓ 20261028-create-users.js</text>
      <text x="15" y="72" font-family="monospace" font-size="10.5" fill="#4ade80">✓ 20261029-add-role-to-users.js</text>
      <text x="15" y="96" font-family="monospace" font-size="10.5" fill="#4ade80">✓ 20261030-create-posts.js</text>

      <g transform="translate(390, 0)">
        <text x="0" y="20" font-family="sans-serif" font-weight="700" font-size="12" fill="#ffffff">Tại sao tuyệt đối không tạo bảng bằng tay trong MySQL Workbench?</text>
        <text x="0" y="44" font-family="sans-serif" font-size="11" fill="#94a3b8">• Khi làm việc nhóm: Đồng đội `git pull` code mới về sẽ bị crash vì thiếu bảng!</text>
        <text x="0" y="66" font-family="sans-serif" font-size="11" fill="#94a3b8">• Khi deploy lên Production: Render/Cloud không có ai bấm chuột tạo bảng giúp bạn.</text>
        <text x="0" y="88" font-family="sans-serif" font-weight="700" font-size="11" fill="#38bdf8">👉 Chỉ cần gõ lệnh: `npx sequelize-cli db:migrate` là toàn bộ team đồng bộ 100%!</text>
      </g>
    </g>
  </g>
</svg>
