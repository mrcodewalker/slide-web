<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <filter id="restShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="1000" height="560" fill="none" />

  <text x="500" y="38" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="22" fill="#0f172a">MÔ HÌNH TRƯỞNG THÀNH REST (RICHARDSON MATURITY MODEL)</text>
  <text x="500" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#64748b">4 Cấp độ tiến hóa kiến trúc RESTful chuẩn công nghiệp (Leonard Richardson)</text>

  <!-- Level 3: HATEOAS -->
  <g transform="translate(80, 100)" filter="url(#restShadow)">
    <rect width="840" height="85" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
    <circle cx="50" cy="42" r="24" fill="#10b981" />
    <text x="50" y="49" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="18" fill="#ffffff">L3</text>
    <text x="95" y="35" font-family="sans-serif" font-weight="800" font-size="16" fill="#065f46">Level 3: HATEOAS (Hypermedia As The Engine Of Application State)</text>
    <text x="95" y="60" font-family="sans-serif" font-size="13" fill="#047857">Phản hồi JSON đính kèm liên kết điều hướng (_links) giúp client tự khám phá các hành động tiếp theo.</text>
  </g>

  <!-- Level 2: HTTP Verbs & Status Codes -->
  <g transform="translate(80, 205)" filter="url(#restShadow)">
    <rect width="840" height="85" rx="14" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2.5" />
    <circle cx="50" cy="42" r="24" fill="#0ea5e9" />
    <text x="50" y="49" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="18" fill="#ffffff">L2</text>
    <text x="95" y="35" font-family="sans-serif" font-weight="800" font-size="16" fill="#0369a1">Level 2: Phương thức HTTP &amp; Mã trạng thái (Mục tiêu của khóa học!)</text>
    <text x="95" y="60" font-family="sans-serif" font-size="13" fill="#0284c7">Dùng đúng GET, POST, PUT, DELETE và HTTP Status 200, 201, 400, 401, 403, 404, 500.</text>
  </g>

  <!-- Level 1: Resources URIs -->
  <g transform="translate(80, 310)" filter="url(#restShadow)">
    <rect width="840" height="85" rx="14" fill="#fefce8" stroke="#eab308" stroke-width="2" />
    <circle cx="50" cy="42" r="24" fill="#eab308" />
    <text x="50" y="49" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="18" fill="#ffffff">L1</text>
    <text x="95" y="35" font-family="sans-serif" font-weight="800" font-size="16" fill="#854d0e">Level 1: Định danh Tài nguyên qua Đường dẫn (Resources URIs)</text>
    <text x="95" y="60" font-family="sans-serif" font-size="13" fill="#a16207">Mỗi thực thể có URL danh từ riêng: /api/posts, /api/users thay vì 1 endpoint duy nhất.</text>
  </g>

  <!-- Level 0: The Swamp of POX -->
  <g transform="translate(80, 415)" filter="url(#restShadow)">
    <rect width="840" height="85" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8" />
    <circle cx="50" cy="42" r="24" fill="#64748b" />
    <text x="50" y="49" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="18" fill="#ffffff">L0</text>
    <text x="95" y="35" font-family="sans-serif" font-weight="800" font-size="16" fill="#334155">Level 0: Đầm lầy RPC (The Swamp of POX)</text>
    <text x="95" y="60" font-family="sans-serif" font-size="13" fill="#475569">Chỉ có 1 endpoint duy nhất (POST /api) và dùng HTTP như một đường ống truyền dữ liệu XML/JSON.</text>
  </g>

  <!-- Level 2 Star Callout -->
  <rect x="760" y="217" width="140" height="28" rx="6" fill="#38bdf8" />
  <text x="830" y="236" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="12" fill="#0f172a">⭐ CHUẨN RESTFUL</text>
</svg>