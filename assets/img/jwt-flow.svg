<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <filter id="flowShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
  </defs>

  <rect width="1000" height="560" fill="none" />

  <text x="500" y="38" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="22" fill="#0f172a">QUY TRÌNH XÁC THỰC STATELESS JWT (AUTHENTICATION FLOW)</text>
  <text x="500" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#64748b">Trao đổi mã truy cập Access Token qua HTTP Authorization Bearer Header</text>

  <!-- Actor 1: Browser / Front-end -->
  <g transform="translate(140, 85)">
    <rect width="180" height="54" rx="12" fill="#0284c7" filter="url(#flowShadow)" />
    <text x="90" y="33" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="15" fill="#ffffff">🌐 Web Client</text>
    <!-- Lifeline -->
    <line x1="90" y1="54" x2="90" y2="440" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6" />
  </g>

  <!-- Actor 2: Node.js Express API -->
  <g transform="translate(680, 85)">
    <rect width="180" height="54" rx="12" fill="#16a34a" filter="url(#flowShadow)" />
    <text x="90" y="33" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="15" fill="#ffffff">🚀 Express API</text>
    <!-- Lifeline -->
    <line x1="90" y1="54" x2="90" y2="440" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6" />
  </g>

  <!-- Step 1: POST /auth/login -->
  <line x1="230" y1="180" x2="760" y2="180" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrowHead)" />
  <rect x="360" y="160" width="280" height="26" rx="6" fill="#f0f9ff" stroke="#bae6fd" />
  <text x="500" y="178" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#0369a1">1. POST /api/v1/auth/login {email, pass}</text>

  <!-- Step 2: Sign JWT & return -->
  <line x1="770" y1="240" x2="240" y2="240" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)" stroke-dasharray="5 5" />
  <rect x="340" y="222" width="320" height="26" rx="6" fill="#f0fdf4" stroke="#bbf7d0" />
  <text x="500" y="240" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#15803d">2. HTTP 200 OK: { accessToken: "eyJhbG..." }</text>

  <!-- Action: Save to localStorage / Cookie -->
  <rect x="150" y="275" width="160" height="34" rx="8" fill="#fef3c7" stroke="#fde68a" />
  <text x="230" y="297" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#b45309">Lưu Token vào client</text>

  <!-- Step 3: Request Protected Resource with Bearer -->
  <line x1="230" y1="350" x2="760" y2="350" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrowHead)" />
  <rect x="330" y="330" width="340" height="26" rx="6" fill="#f0f9ff" stroke="#bae6fd" />
  <text x="500" y="348" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#0369a1">3. GET /posts [Authorization: Bearer &lt;token&gt;]</text>

  <!-- Action on API: Verify Signature -->
  <rect x="690" y="380" x2="160" width="160" height="34" rx="8" fill="#f3e8ff" stroke="#e9d5ff" />
  <text x="770" y="402" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#6b21a8">jwt.verify(token, secret)</text>

  <!-- Step 4: Return protected data -->
  <line x1="770" y1="440" x2="240" y2="440" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)" stroke-dasharray="5 5" />
  <rect x="360" y="422" width="280" height="26" rx="6" fill="#f0fdf4" stroke="#bbf7d0" />
  <text x="500" y="440" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#15803d">4. HTTP 200 OK: { data: [...] }</text>

  <!-- Bottom Tip -->
  <rect x="140" y="495" width="720" height="42" rx="10" fill="#0f172a" />
  <text x="500" y="522" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8">
    Bảo mật: Nếu token bị hết hạn hoặc chữ ký không khớp, middleware trả ngay HTTP 401 Unauthorized.
  </text>
</svg>